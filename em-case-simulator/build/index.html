<script>
"use strict";
const SHARED = JSON.parse(document.getElementById('shared-data').textContent);
const CASES  = JSON.parse(document.getElementById('cases-data').textContent);
/*__ENGINE_START__*/
/* ============================================================
   Engine. Case-agnostic: no clinical knowledge, no case names.
   Mirrors system-design-v2.md section 12 components.

   v2 changes: the action surface is the action catalog, not the case. A case
   action binds onto a catalog entry and supplies the tag, prompt, prerequisites
   and debrief note. Everything else is inert. Study results resolve case first,
   catalog default second, nothing third.
   ============================================================ */

/* ---------- condition language (section 4) ---------- */
function tokenize(s){
  return s.replace(/\(/g,' ( ').replace(/\)/g,' ) ').trim().split(/\s+/).filter(Boolean);
}
function parseCond(s){
  if(s===null||s===undefined||s==='') return {t:'true'};
  const p={i:0,k:tokenize(s)};
  const n=pExpr(p);
  if(p.i<p.k.length) throw new Error('trailing tokens in condition: '+s);
  return n;
}
function pExpr(p){ let a=pTerm(p); while(p.k[p.i]==='OR'){p.i++; a={t:'or',a,b:pTerm(p)};} return a; }
function pTerm(p){ let a=pFac(p); while(p.k[p.i]==='AND'){p.i++; a={t:'and',a,b:pFac(p)};} return a; }
function pFac(p){
  if(p.k[p.i]==='NOT'){p.i++; return {t:'not',a:pFac(p)};}
  if(p.k[p.i]==='('){p.i++; const e=pExpr(p); if(p.k[p.i]!==')') throw new Error('unbalanced parens'); p.i++; return e;}
  return pAtom(p);
}
function pAtom(p){
  const k=p.k, i=p.i;
  if(k[i]==='phase'&&k[i+1]==='is'){p.i=i+3; return {t:'phase',v:k[i+2]};}
  if(k[i]==='flag'&&k[i+2]==='set'){p.i=i+3; return {t:'flag',v:k[i+1]};}
  if(k[i]==='study'&&k[i+2]==='ordered'){p.i=i+3; return {t:'ordered',v:k[i+1]};}
  if(k[i]==='study'&&k[i+2]==='resulted'){p.i=i+3; return {t:'resulted',v:k[i+1]};}
  if(k[i]==='action'&&k[i+2]==='taken'){p.i=i+3; return {t:'taken',v:k[i+1]};}
  /* The catalog ships prerequisites written as "flag F" without the trailing
     keyword, which section 4 does not permit. Accept it here so the prototype can
     run, and record it so the interface can say the grammar is being bent. */
  if(k[i]==='flag'&&(k[i+2]===undefined||k[i+2]==='AND'||k[i+2]==='OR'||k[i+2]===')')){
    LOOSE_CONDITIONS.add(p.k.join(' '));
    p.i=i+2; return {t:'flag',v:k[i+1]};
  }
  throw new Error('unparseable atom near: '+k.slice(i,i+3).join(' '));
}
const LOOSE_CONDITIONS=new Set();

function evalCond(n,st){
  switch(n.t){
    case 'true':     return true;
    case 'and':      return evalCond(n.a,st)&&evalCond(n.b,st);
    case 'or':       return evalCond(n.a,st)||evalCond(n.b,st);
    case 'not':      return !evalCond(n.a,st);
    case 'phase':    return st.phase===n.v;
    case 'flag':     return st.flags.has(n.v);
    case 'ordered':  return st.ordered.has(n.v);
    case 'resulted': return st.resulted.has(n.v);
    case 'taken':    return st.taken.has(n.v);
  }
  return false;
}
const _ccache=new Map();
function cond(s){ if(!_ccache.has(s)) _ccache.set(s,parseCond(s)); return _ccache.get(s); }
function test(s,st){ return evalCond(cond(s===null?'':s),st); }

/* resolver: first match wins, unconditional default last */
function resolve(rules,st){
  for(const r of rules){ if(r.when===null||r.when===undefined||test(r.when,st)) return r.value; }
  return null;
}

/* ---------- case selection and the catalog merge ----------
   PROTO is assembled here rather than at build time so that every case shares one
   copy of the catalog. Section 6.2: catalog defaults apply unless the case waives
   them, and case prerequisites are additional rather than a replacement. */
let CASE=null, PROTO=null, PACK=null;
let PHASE={}, ACT={}, FU={}, CK=null, CONTENT={}, GENERAL_STATUS=null;

function orphanCategory(eff){
  if(eff.indexOf('exam_')===0) return 'exam';
  if(eff.indexOf('consult_')===0) return 'consultant';
  if(/^(labs_|echo_|cxr|ct_|pocus)/.test(eff)) return 'investigation';
  if(eff.indexOf('interview_topic_')===0) return 'interview';
  if(eff==='handoff_submit') return 'handoff';
  return 'stabilization';
}

function mergeAction(eff, base, caseAct, extra){
  base = base||{}; caseAct = caseAct||{};
  const waived=(caseAct.prerequisite_overrides||[]).map(w=>w.waived).filter(Boolean);
  const prereqs=[], seen=new Set();
  for(const p of (base.default_prerequisites||[])){
    if(seen.has(p.when)||waived.indexOf(p.when)>=0) continue;
    seen.add(p.when); prereqs.push(Object.assign({},p,{origin:'catalog_default'}));
  }
  for(const p of (caseAct.prerequisites||[])){
    if(seen.has(p.when)) continue;
    seen.add(p.when); prereqs.push(Object.assign({},p,{origin:'case'}));
  }
  const origins=new Set(prereqs.map(p=>p.origin));
  const flags=[...new Set((caseAct.flags_set||[]).concat(base.flags_set_default||[]))];
  const rec={
    id:eff,
    catalog_id:base.id||null,
    name:((extra&&extra.coveredBy)?null:caseAct.display_name)||base.name||eff.replace(/_/g,' '),
    tab:(extra&&extra.tab)||base.tab,
    group:(extra&&extra.group)||base.group,
    category:base.category||(extra&&extra.category)||orphanCategory(eff),
    state_changing:base.state_changing!==undefined?base.state_changing
                  :(caseAct.state_changing!==undefined?caseAct.state_changing:true),
    turnaround_class:base.turnaround_class||null,
    turnaround_override:caseAct.turnaround_override_seconds||null,
    narration_template:base.narration_template||(extra&&extra.narration_template)||null,
    dose_required:!!base.dose_required,
    persistent:!!base.persistent,
    repeatable:base.repeatable!==false,
    prerequisites:prereqs,
    prerequisite_source:origins.size>1?'mixed':(prereqs.length?prereqs[0].origin:'none'),
    prerequisite_waived:waived,
    flags_set:flags,
    default_result:base.default_result||null,
    bound:!!caseAct.catalog_id,
    orphan:!!(extra&&extra.orphan),
    shadowed:(extra&&extra.shadowed)||[],
    covered_by:(extra&&extra.coveredBy)||null
  };
  if(caseAct.catalog_id){
    rec.tag=caseAct.tag;
    rec.prompt=caseAct.prompt;
    rec.debrief_note=caseAct.debrief_note;
    rec.references=caseAct.references;
    rec.halt_reason=caseAct.halt_reason;
    rec.follow_ups_triggered=caseAct.follow_ups_triggered;
  }
  return rec;
}

function buildActions(pack){
  const caseActs={};
  pack.case.case_actions.forEach(a=>caseActs[a.catalog_id]=a);
  const hiddenBy={};   // case id bound to a catalog entry another case action already holds
  Object.keys(pack.shadowed||{}).forEach(h=>{
    const owner=pack.shadowed[h];
    (hiddenBy[owner]=hiddenBy[owner]||[]).push(h);
  });
  const out={};
  for(const cid in SHARED.actionsBase){
    const eff=(pack.bindings||{})[cid]||cid;
    /* covers: this catalog entry keeps its own id and name, but takes the case
       fields of another action, so a tag applies to every route to the same act. */
    const via=(pack.covers||{})[cid];
    const ca=caseActs[eff]||(via?caseActs[via]:null);
    out[eff]=mergeAction(eff, SHARED.actionsBase[cid], ca,
                         {shadowed:hiddenBy[eff]||[], coveredBy:via||null});
  }
  for(const eff in (pack.orphans||{})){
    const o=pack.orphans[eff];
    out[eff]=mergeAction(eff, null, caseActs[eff], Object.assign({orphan:true},o));
  }
  return out;
}

/* let-bindings inside an eval are not visible to the caller, so the test harness
   reads them through this instead of touching the variables. */
function engineState(){ return {CASE,PROTO,PACK,PHASE,ACT,FU,CK,CONTENT,GENERAL_STATUS}; }

function selectCase(ref){
  PACK = typeof ref==='number' ? CASES[ref]
       : CASES.find(c=>c.prefix===ref||c.id===ref);
  if(!PACK) throw new Error('no such case: '+ref);
  CASE = PACK.case;
  PROTO = Object.assign({}, SHARED, {
    actions: buildActions(PACK),
    bindingCounts: PACK.bindingCounts,
    shadowed: PACK.shadowed,
    phaseShort: PACK.phaseShort,
    traps: PACK.traps,
    dispOrder: PACK.dispOrder,
    dispLabels: PACK.dispLabels,
    correctDxId: PACK.correctDxId,
    correctDxExplanation: PACK.correctDxExplanation,
    altDx: PACK.altDx,
    promptCap: PACK.promptCap,
    buildNotes: PACK.buildNotes
  });
  PHASE={}; CASE.phases.forEach(p=>PHASE[p.id]=p);
  ACT=PROTO.actions;
  FU={}; (CASE.follow_ups||[]).forEach(f=>FU[f.id]=f);
  CK=CASE.content_keys;
  CONTENT={};
  ['exam','labs','imaging','consultants'].forEach(g=>{
    Object.keys(CK[g]||{}).forEach(k=>{
      if(k==='authoring_note') return;
      const v=CK[g][k];
      CONTENT[k]=Array.isArray(v)?v:v.rules;
    });
  });
  GENERAL_STATUS = CK.general_status ? CK.general_status.rules : null;
  return PACK;
}

/* The line above the exam list. Case rules first, catalog default second. */
function generalStatus(st){
  if(GENERAL_STATUS){
    const v=resolve(GENERAL_STATUS,st);
    if(v) return {value:v,source:'case'};
  }
  return {value:SHARED.generalStatusDefault,source:'catalog_default'};
}

const catOf   = id => (ACT[id]||{}).category;
const IS_STUDY   = id=>catOf(id)==='investigation';
const IS_EXAM    = id=>catOf(id)==='exam';
const IS_CONSULT = id=>catOf(id)==='consultant';

function turnaround(id){
  const a=ACT[id]||{};
  if(a.turnaround_override) return a.turnaround_override;
  return PROTO.turnaround[a.turnaround_class]!==undefined
       ? PROTO.turnaround[a.turnaround_class] : PROTO.turnaround.lab;
}
function tagOf(id,st){
  const a=ACT[id];
  if(!a||!a.tag) return 'neutral';
  return resolve(a.tag,st)||'neutral';
}
function stateChanging(id){
  const a=ACT[id];
  if(!a) return false;
  if(IS_EXAM(id)) return false;
  if(catOf(id)==='interview') return false;
  return a.state_changing!==false;
}
function dispName(id){ return (ACT[id]&&ACT[id].name)||id.replace(/_/g,' '); }

/* ---------- result resolution: case, then catalog default, then nothing ------ */
function resolveResult(id,snap){
  if(CONTENT[id]) return {value:resolve(CONTENT[id],snap),source:'case'};
  const d=(ACT[id]||{}).default_result;
  if(d) return {value:d,source:'catalog_default'};
  return {value:null,source:'none'};
}

/* ---------- the fold (section 5.2) ---------- */
function snapshot(st){
  return {phase:st.phase,flags:new Set(st.flags),ordered:new Set(st.ordered),
          resulted:new Set(st.resulted),taken:new Set(st.taken)};
}
/* difficultyMultiplier scales every nurse prompt deadline, including escalations
   and follow-up prompts. It scales nothing else: result turnaround, transitions and
   tags are unaffected, so the medicine is identical in both modes and only the
   amount of help changes. */
function fold(log, now, difficultyMultiplier){
  const DM = difficultyMultiplier || 1;
  const st={
    phase:CASE.phases[0].id, flags:new Set(), ordered:new Set(), resulted:new Set(), taken:new Set(),
    orders:{}, phaseEntry:{}, phaseSeq:[], halted:null, complete:null, earlyExit:null,
    nurse:[], readouts:[], blocked:[], timeline:[], prompted:new Set(),
    promptFires:[], fuFires:[], fuOutstanding:new Set(), handoff:null, now:now, dm:DM,
    expected:new Set(), expectedByPhase:{}, recommendedTaken:new Set(), defaultsServed:new Set()
  };
  st.phaseEntry[st.phase]=0;
  st.phaseSeq.push({id:st.phase,t:0});

  const ev=[]; let evseq=0;
  const push=(e)=>{ e._s=evseq++; e.done=false; ev.push(e); };
  const promptCount={};

  function onPhaseEntry(phase,t){
    const entrySt=snapshot(st); entrySt.phase=phase;
    for(const id in ACT){
      const a=ACT[id];
      if(a.tag&&tagOf(id,entrySt)==='critical'){
        st.expected.add(id);
        (st.expectedByPhase[phase]=st.expectedByPhase[phase]||new Set()).add(id);
      }
      if(!a.prompt) continue;
      if(tagOf(id,entrySt)!=='critical') continue;
      push({t:t+a.prompt.deadline_seconds*DM,kind:'prompt',id,phase,level:1});
      if(a.prompt.escalation)
        push({t:t+a.prompt.escalation.deadline_seconds*DM,kind:'prompt',id,phase,level:2});
    }
  }
  function cancelPromptsFor(phase){
    for(const e of ev) if(e.kind==='prompt'&&e.phase===phase&&!e.done) e.done=true;
  }
  function enterPhase(to,t){
    cancelPromptsFor(st.phase);
    st.phase=to;
    st.phaseEntry[to]=t;
    st.phaseSeq.push({id:to,t});
    if(!PHASE[to].terminal) onPhaseEntry(to,t);
  }
  function checkTransitions(t){
    const p=PHASE[st.phase];
    if(!p||!p.transitions) return;
    for(const tr of p.transitions){
      if(test(tr.when,st)){ if(tr.to!==st.phase) enterPhase(tr.to,t); return; }
    }
  }

  onPhaseEntry(st.phase,0);

  let li=0;
  for(;;){
    if(st.halted||st.complete||st.earlyExit) break;
    const L=(li<log.length&&log[li].t<=now)?log[li]:null;
    let E=null;
    for(const e of ev){ if(!e.done&&e.t<=now&&(!E||e.t<E.t||(e.t===E.t&&e._s<E._s))) E=e; }
    if(!L&&!E) break;
    let takeLog;
    if(!E) takeLog=true; else if(!L) takeLog=false; else takeLog=(L.t<=E.t);
    if(takeLog){ applyLog(log[li],log[li].t); li++; }
    else { E.done=true; applyEvent(E,E.t); }
  }

  function narrate(t,text,kind){ if(text) st.nurse.push({t,text,kind:kind||'narration'}); }

  function applyLog(entry,t){
    const id=entry.actionId;
    const a=ACT[id];

    if(entry.kind==='early_exit'){
      st.earlyExit={t}; st.timeline.push({t,id:'early_exit',type:'end',label:'Ended the case early'});
      return;
    }
    if(entry.kind==='interview'){
      const G=CASE.interview.global_answer_rules||[];
      const T=entry.topic?CASE.interview.topics.find(x=>x.topic===entry.topic):null;
      const rules=G.concat(T?T.answer:CASE.interview.out_of_scope_fallback);
      const ans=resolve(rules,st);
      st.timeline.push({t,id:'interview:'+(entry.topic||'unmatched'),type:'observational',
        label:entry.topic?('Asked about '+entry.topic.replace(/_/g,' ')):'Question not understood'});
      st.readouts.push({t,kind:'speech',key:entry.topic||'unmatched',title:entry.q,body:ans,
        matched:entry.topic||null});
      if(entry.topic&&ACT['interview_topic_'+entry.topic]) st.taken.add('interview_topic_'+entry.topic);
      return;
    }
    if(!a) return;

    /* prerequisite checker: the condition is a requirement that must hold */
    for(const pr of (a.prerequisites||[])){
      let ok;
      try{ ok=test(pr.when,st); }catch(e){ ok=true; }   // unparseable catalog condition
      if(!ok){
        st.blocked.push({t,id,message:pr.failure_message,source:pr.origin||a.prerequisite_source});
        st.timeline.push({t,id,type:'blocked',label:'Blocked: '+dispName(id)});
        narrate(t,pr.failure_message,'blocked');
        return;
      }
    }

    st.taken.add(id);

    if(!stateChanging(id)){
      if(IS_EXAM(id)){
        const r=CONTENT[id]?{value:resolve(CONTENT[id],st),source:'case'}
                           :{value:(ACT[id]||{}).default_result||null,source:'catalog_default'};
        st.readouts.push({t,kind:'exam',key:id,title:dispName(id),
          body:r.value,source:r.source});
        if(r.source!=='case') st.defaultsServed.add(id);
      } else if(IS_CONSULT(id)){
        st.readouts.push({t,kind:'consult',key:id,title:dispName(id),
          body: CONTENT[id]?resolve(CONTENT[id],st):PROTO.globalConsultant,
          source: CONTENT[id]?'case':'catalog_default'});
        if(!CONTENT[id]) st.defaultsServed.add(id);
      }
      st.timeline.push({t,id,type:'observational',label:dispName(id)});
      return;
    }

    const tag=tagOf(id,st);
    st.timeline.push({t,id,type:'state-changing',label:dispName(id),tag});

    if(tag==='harmful'){
      st.halted={t,id,reason:a.halt_reason||'This action halted the case.'};
      enterPhase('halted',t);
      narrate(t,a.halt_reason||'',"halt");
      return;
    }
    if(tag==='recommended') st.recommendedTaken.add(id);
    narrate(t,narrationFor(id),'narration');

    (a.flags_set||[]).forEach(f=>st.flags.add(f));

    if(IS_CONSULT(id)){
      st.readouts.push({t,kind:'consult',key:id,title:dispName(id),
        body: CONTENT[id]?resolve(CONTENT[id],st):PROTO.globalConsultant,
        source: CONTENT[id]?'case':'catalog_default'});
      if(!CONTENT[id]) st.defaultsServed.add(id);
    }

    if(IS_STUDY(id)){
      st.ordered.add(id);
      const due=t+turnaround(id);
      const rec={orderT:t,dueT:due,snap:snapshot(st),value:null,source:null};
      (st.orders[id]=st.orders[id]||[]).push(rec);
      push({t:due,kind:'result',id,rec});
    }

    (a.follow_ups_triggered||[]).forEach(fid=>{
      const f=FU[fid]; if(!f) return;
      push({t:t+f.deadline_seconds*DM,kind:'followup',fid});
    });

    if(id==='handoff_submit') st.handoff=entry.payload||null;

    checkTransitions(t);
    if(st.phase==='case_complete') st.complete={t};
  }

  function applyEvent(e,t){
    if(e.kind==='result'){
      const r=resolveResult(e.id,e.rec.snap);
      e.rec.value=r.value; e.rec.source=r.source;
      if(r.source==='catalog_default') st.defaultsServed.add(e.id);
      st.resulted.add(e.id);
      const a=ACT[e.id]||{};
      const tmpl={lab:'{name} is back.',imaging:'{name} is up on the screen.',
                  ecg:'{name} is up.',bedside:'{name} is done.'}[a.turnaround_class]||'{name} is back.';
      narrate(t,tmpl.replace('{name}',dispName(e.id)),'result');
      return;
    }
    if(e.kind==='prompt'){
      if(st.taken.has(e.id)) return;
      const a=ACT[e.id];
      if(a.prompt.guard&&!test(a.prompt.guard,st)) return;
      promptCount[e.phase]=(promptCount[e.phase]||0);
      if(promptCount[e.phase]>=PROTO.promptCap) return;
      promptCount[e.phase]++;
      narrate(t,e.level===2?a.prompt.escalation.text:a.prompt.text,'prompt');
      st.prompted.add(e.id);
      st.promptFires.push({t,id:e.id,level:e.level});
      return;
    }
    if(e.kind==='followup'){
      const f=FU[e.fid];
      if(f.applies_when&&!test(f.applies_when,st)) return;
      if(f.satisfied_by&&f.satisfied_by.some(x=>st.taken.has(x))) return;
      promptCount[st.phase]=(promptCount[st.phase]||0)+1;
      narrate(t,f.nurse_prompt,'prompt');
      st.fuFires.push({t,fid:e.fid});
      st.fuOutstanding.add(e.fid);
      return;
    }
  }

  st.pending=[];
  Object.keys(st.orders).forEach(id=>st.orders[id].forEach(o=>{
    if(o.value===null) st.pending.push({id,dueT:o.dueT,orderT:o.orderT});
  }));
  st.fuOutstanding.forEach(fid=>{
    const f=FU[fid];
    if(f.satisfied_by&&f.satisfied_by.some(x=>st.taken.has(x))) st.fuOutstanding.delete(fid);
  });
  return st;
}

function narrationFor(id){
  const a=ACT[id]||{};
  if(a.narration_template){
    /* Dose entry is not implemented, so {dose} is dropped rather than faked. */
    return a.narration_template.replace('{name}',a.name.toLowerCase())
                               .replace('{dose}','').replace(/\s{2,}/g,' ')
                               .replace(' of .','.').replace(' at .','.').trim();
  }
  if(IS_STUDY(id)) return dispName(id)+' is away.';
  return 'Okay: '+dispName(id).toLowerCase()+'.';
}

/*__ENGINE_END__*/
/* ============================================================
   Audio. Two channels:

   1. A continuous heartbeat. Tempo follows the heart rate from the current
      phase's authored vitals. Pitch follows oxygen saturation: A5 at the
      reference saturation, one semitone lower per percent below it.
   2. A short two-note trill whenever the nurse issues a prompt.

   The pitch mapping makes desaturation audible before the resident looks at
   the monitor, which is the intended effect but is also a teaching decision
   worth flagging: a real bedside monitor's pitch drop is not linear in
   semitones and does not start at 100%.

   Browsers will not start audio without a gesture, so the context is created
   on the first click and the toggle reflects real state rather than intent.
   ============================================================ */
const AUDIO = (() => {
  /* Audio configuration is global, not per case, so it reads SHARED. Reading PROTO
     here would capture null: this module is evaluated before any case is selected. */
  const CFG = SHARED.audio;
  let ctx = null, master = null, on = true, beatTimer = null, lastRateKey = null;

  function ensure() {
    if (ctx) {
      if (ctx.state === 'suspended') ctx.resume();
      return true;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0.85;
    master.connect(ctx.destination);
    return true;
  }

  /* A5 at the reference saturation, one semitone per percent below it. */
  function pitchFor(spo2) {
    const steps = (CFG.spo2Reference - spo2) * CFG.semitonesPerPercent;
    return CFG.baseHz * Math.pow(2, -steps / 12);
  }

  /* One thump: a short pitched blip with a percussive envelope. */
  function thump(hz, at, gain, dur) {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(hz, at);
    o.frequency.exponentialRampToValueAtTime(Math.max(40, hz * 0.55), at + dur);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(gain, at + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(g).connect(master);
    o.start(at);
    o.stop(at + dur + 0.02);
  }

  /* lub-dub: the second sound is quieter, lower and close behind the first. */
  function beat(hz) {
    const t = ctx.currentTime + 0.01;
    thump(hz, t, 0.30, 0.14);
    thump(hz * 0.75, t + 0.16, 0.17, 0.11);
  }

  function schedule() {
    clearInterval(beatTimer);
    beatTimer = null;
    if (!on || !ctx) return;
    const v = currentVitals();
    if (!v) return;
    const interval = 60000 / Math.max(20, Math.min(220, v.heart_rate));
    const hz = pitchFor(v.oxygen_saturation);
    beat(hz);
    beatTimer = setInterval(() => {
      const cur = currentVitals();
      if (!cur) { stop(); return; }     /* the case changed under us, or has no vitals */
      beat(pitchFor(cur.oxygen_saturation));
    }, interval);
  }

  function currentVitals() {
    if (!CASE) return null;
    const p = PHASE[ST ? ST.phase : CASE.phases[0].id];
    let v = p ? p.vitals : null;
    /* The monitor travels to the new phase's numbers over five seconds. The
       heartbeat travels with it, because a beat that jumps to the new rate
       while the displayed rate is still moving sounds like a fault. Guarded by
       typeof so this file keeps working without the UI layer. */
    if (typeof rampedVitals === 'function') { const r = rampedVitals(); if (r) v = r; }
    /* An unauthored case has null vitals. There is no tempo and no pitch to derive,
       so play nothing rather than guessing at a rate. */
    if (!v || typeof v.heart_rate !== 'number' || typeof v.oxygen_saturation !== 'number') return null;
    return v;
  }

  /* Called every render. Restarts the loop only when rate or pitch actually change,
     so the beat does not stutter on every frame. */
  function sync() {
    if (!on || !ctx) return;
    const v = currentVitals();
    if (!v) return;
    /* Quantised. During a ramp the raw values change every frame, and
       rescheduling the beat three hundred times over five seconds restarts the
       interval on each pass and sounds like stumbling. Two beats per minute and
       one percent are below what the ear picks out anyway. */
    const key = (Math.round(v.heart_rate / 2) * 2) + ':' + Math.round(v.oxygen_saturation);
    if (key !== lastRateKey) {
      lastRateKey = key;
      schedule();
    }
  }

  function stop() {
    clearInterval(beatTimer);
    beatTimer = null;
    lastRateKey = null;
  }

  /* Nurse prompt: a rising two-note trill, deliberately unlike the heartbeat. */
  function trill() {
    if (!on || !ensure()) return;
    const t = ctx.currentTime + 0.01;
    [[1318.5, 0], [1760.0, 0.09]].forEach(([hz, off]) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(hz, t + off);
      g.gain.setValueAtTime(0.0001, t + off);
      g.gain.exponentialRampToValueAtTime(0.22, t + off + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + off + 0.14);
      o.connect(g).connect(master);
      o.start(t + off);
      o.stop(t + off + 0.16);
    });
  }

  /* Called on any user gesture. Creates or resumes the context, but never
     turns the sound back on after the user has switched it off. */
  function unlock() {
    if (!on) return false;
    if (!ensure()) return false;
    sync();
    return true;
  }

  function start() {
    if (!ensure()) return false;
    on = true;
    lastRateKey = null;
    sync();
    return true;
  }

  function toggle() {
    if (on && ctx) {
      on = false;
      stop();
    } else {
      on = true;
      start();
    }
    return on;
  }

  return {
    start, unlock, toggle, sync, trill, stop,
    get running() { return on && !!ctx && ctx.state === 'running'; },
    get enabled() { return on; },
    /* exposed so the interface can state the mapping rather than hide it */
    describe() {
      const v = currentVitals();
      if (!v) return '';
      const steps = (CFG.spo2Reference - v.oxygen_saturation) * CFG.semitonesPerPercent;
      return `${Math.round(v.heart_rate)} bpm, ${Math.round(pitchFor(v.oxygen_saturation))} Hz `
           + `(${CFG.baseNote} minus ${steps} semitone${steps === 1 ? '' : 's'})`;
    }
  };
})();

/* ============================================================
   SEMANTIC MATCHING LAYER

   A sentence-embedding model that runs entirely in the learner's browser.
   Nothing is sent anywhere: there is no API key, no server, no per-question
   cost, and after the first load no network call. The model is
   all-MiniLM-L6-v2, int8 quantised, about 23 MB, fetched once from the
   Hugging Face CDN and then served from the browser's cache.

   PROGRESSIVE BY DESIGN. This file is inert until the model finishes loading.
   Until then, and permanently if loading fails, the lexical matcher in ui.js
   is the only matcher and behaviour is byte-identical to the build before this
   file existed. A resident on a bad connection gets the old simulator, not a
   broken one. Nothing here is on the critical path of starting or playing a
   case.

   WHY EMBEDDINGS RATHER THAN A CHAT MODEL. The task is to put a short question
   into one of about thirty-four buckets. That is what sentence embeddings are
   for. A chat model would need a server to hold the API key, would cost money
   per question, would add latency to a patient who is meant to answer at once,
   and would be non-deterministic, which matters in a tool whose debrief claims
   to report what the learner actually did.

   WHAT THIS FIXES. The lexical matcher scores by shared tokens, so a question
   sharing no token with any authored variant scores exactly zero. Measured on
   the CHFE bank, 31 of 40 common clinical terms and abbreviations appear in
   none of the 340 variants, so "PND?", "orthopnea?", "PMH?" and "NKDA?" all
   fell straight through to the out-of-scope fallback. An embedding model puts
   those next to the lay phrasings without anyone authoring them.

   ------------------------------------------------------------
   THE THRESHOLDS BELOW ARE NOT MEASURED. READ THIS.
   ------------------------------------------------------------
   They are starting values chosen to be conservative, not values fitted to
   this bank. They were set without running the model against the case,
   because the machine this was written on could not reach the model weights.

   Section 10.6 of the authoring requirements already asks for a matcher
   evaluation per case pack and already warns that tuning against a held-out
   set and then quoting the result measures memorisation. `engine/matcher_eval.mjs`
   is that harness. Run it before trusting any number in this file, and change
   these three constants to what it reports.

   Until that is done, the fusion rule below is deliberately arranged so the
   semantic layer can mostly only ADD correct matches: where it is not
   confident, the lexical result stands unchanged.
   ============================================================ */
const SEM = (function () {
  'use strict';

  /* ---------- tuning ---------- */
  const ACCEPT = 0.62;  // cosine at or above this: the semantic topic wins outright
  const AGREE  = 0.45;  // between AGREE and ACCEPT: wins only if lexical picked the same topic
  /* VETO would withhold an answer where nothing in the bank is close, even if
     the lexical matcher found a token overlap. It is DISABLED (0) by choice,
     not by oversight.

     The case for it is section 10.6: an out-of-scope question answered as
     though it were a different question is a wrong answer the learner cannot
     see. The case against it, which won here, is that this simulator is the
     learner's only source of history. There is no textbook page, no chart to
     re-read and no attending to ask, so an answer withheld is information lost
     for good, while a poorly matched answer at least sits in the transcript
     directly beneath the question the learner typed, where it can be judged.

     Set it back to about 0.28 to trade answers for safety, and measure the
     change with engine/matcher_eval.mjs before believing either number. */
  const VETO   = 0;

  const MODEL_ID = 'Xenova/all-MiniLM-L6-v2';
  /* Pinned exactly. An unpinned CDN URL means the matcher can change under a
     case that was validated against a different one. The web build is an ES
     module with a named `pipeline` export. */
  const LIB_URL = 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0/dist/transformers.min.js';

  const DIM = 384;             // all-MiniLM-L6-v2 embedding width
  const BATCH = 24;            // bank rows embedded per turn, then yield to the UI
  const LIB_TIMEOUT_MS = 45000;
  const BANK_TIMEOUT_MS = 180000;

  const CACHE_DB = 'emsim-embeddings';
  const CACHE_STORE = 'vec';

  /* ---------- state ----------
     idle -> loading -> ready, or -> unavailable, which is terminal. There is
     no retry loop: a learner who is offline should not have the tab repeatedly
     trying to pull 23 MB while they work. */
  let state = 'idle';
  let extractor = null;
  let vecs = null;      // Float32Array of rows.length * DIM, unit length, row major
  let rows = [];        // [{topic, form}] parallel to vecs
  let bankKey = null;
  let gen = 0;          // guards against a case switch mid-load
  let lastError = null;
  const listeners = [];

  function setState(s) {
    if (s === state) return;
    state = s;
    for (const fn of listeners) { try { fn(s); } catch (e) { /* a listener must not stall the loader */ } }
  }

  /* ---------- small helpers ---------- */
  function hash(str) {                       // FNV-1a, only used to key the cache
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
    return (h >>> 0).toString(36);
  }
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  function withTimeout(p, ms, what) {
    return Promise.race([p, sleep(ms).then(() => { throw new Error('timed out loading ' + what); })]);
  }

  /* ---------- embedding cache ----------
     Saves re-embedding 340 short strings on every load. Every path here
     swallows its own errors: IndexedDB is unavailable on file:// in some
     browsers, and in a private window in others, and a missing cache is a
     few seconds of background work rather than a failure. */
  function openDb() {
    return new Promise((res, rej) => {
      let r;
      try { r = indexedDB.open(CACHE_DB, 1); } catch (e) { return rej(e); }
      r.onupgradeneeded = () => { try { r.result.createObjectStore(CACHE_STORE); } catch (e) {} };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error || new Error('indexeddb open failed'));
      r.onblocked = () => rej(new Error('indexeddb blocked'));
    });
  }
  async function cacheGet(k) {
    try {
      const db = await openDb();
      return await new Promise((res, rej) => {
        const q = db.transaction(CACHE_STORE, 'readonly').objectStore(CACHE_STORE).get(k);
        q.onsuccess = () => res(q.result || null);
        q.onerror = () => rej(q.error);
      });
    } catch (e) { return null; }
  }
  async function cachePut(k, buf) {
    try {
      const db = await openDb();
      await new Promise((res, rej) => {
        const q = db.transaction(CACHE_STORE, 'readwrite').objectStore(CACHE_STORE).put(buf, k);
        q.onsuccess = () => res();
        q.onerror = () => rej(q.error);
      });
    } catch (e) { /* cache is an optimisation, never a requirement */ }
  }

  /* ---------- model ---------- */
  async function makeExtractor(lib) {
    try {
      /* Remote only. Without this the library probes for a local /models path
         first, which on file:// produces a console error on every load and
         finds nothing. */
      if (lib.env) {
        lib.env.allowLocalModels = false;
        lib.env.allowRemoteModels = true;
      }
    } catch (e) { /* env shape is not part of the public contract */ }

    /* q8 is the 23 MB int8 build. The fallbacks cover older option spellings so
       a version bump does not silently drop to the 90 MB float32 weights. */
    const attempts = [{ dtype: 'q8' }, { quantized: true }, {}];
    let last = null;
    for (const opt of attempts) {
      try { return await lib.pipeline('feature-extraction', MODEL_ID, opt); }
      catch (e) { last = e; }
    }
    throw last || new Error('could not create the feature extraction pipeline');
  }

  async function embed(texts) {
    /* normalize:true makes every vector unit length, so a dot product is the
       cosine and no division is needed at match time. */
    const out = await extractor(texts, { pooling: 'mean', normalize: true });
    return out.data;                        // Float32Array, texts.length * DIM
  }

  async function embedBank(myGen) {
    const all = new Float32Array(rows.length * DIM);
    for (let i = 0; i < rows.length; i += BATCH) {
      if (myGen !== gen) return null;                 // a different case was selected
      const chunk = rows.slice(i, i + BATCH).map(r => r.form);
      const data = await embed(chunk);
      all.set(data.subarray(0, chunk.length * DIM), i * DIM);
      await sleep(0);                                 // let the UI paint between batches
    }
    return all;
  }

  /* ---------- public ---------- */

  /* Called once per case selection. Safe to call repeatedly. */
  async function init(caseId, topics) {
    if (state === 'unavailable') return;              // terminal, do not retry
    if (typeof indexedDB === 'undefined' && typeof fetch !== 'function') return;

    const nextRows = [];
    for (const t of (topics || [])) {
      for (const f of [t.canonical].concat(t.variants || [])) {
        if (typeof f === 'string' && f.trim()) nextRows.push({ topic: t.topic, form: f });
      }
    }
    if (!nextRows.length) return;

    const key = caseId + '|' + MODEL_ID + '|' + nextRows.length + '|'
              + hash(nextRows.map(r => r.form).join(''));
    if (key === bankKey && (state === 'ready' || state === 'loading')) return;

    const myGen = ++gen;
    bankKey = key;
    rows = nextRows;
    vecs = null;
    setState('loading');

    try {
      if (!extractor) {
        const lib = await withTimeout(import(LIB_URL), LIB_TIMEOUT_MS, 'the embedding library');
        if (myGen !== gen) return;
        extractor = await withTimeout(makeExtractor(lib), BANK_TIMEOUT_MS, 'the embedding model');
        if (myGen !== gen) return;
      }

      const cached = await cacheGet(key);
      if (cached && cached.byteLength === rows.length * DIM * 4) {
        vecs = new Float32Array(cached);
      } else {
        const built = await withTimeout(embedBank(myGen), BANK_TIMEOUT_MS, 'the question bank');
        if (myGen !== gen || !built) return;
        vecs = built;
        cachePut(key, vecs.buffer.slice(0));
      }

      if (myGen !== gen) return;
      setState('ready');
    } catch (e) {
      lastError = e;
      /* Deliberately not console.error: on a page a learner may have opened
         from a file, a red console entry reads as a broken simulator when the
         simulator is working exactly as designed. */
      if (typeof console !== 'undefined' && console.info) {
        console.info('[sim] semantic matching unavailable, staying on lexical matching:', e && e.message);
      }
      setState('unavailable');
    }
  }

  /* Best topic for a free-text question by cosine similarity, or null when the
     layer is not ready. Never throws: a failure here must not lose the
     learner's question. */
  async function best(q) {
    if (state !== 'ready' || !vecs) return null;
    let data;
    try { data = await embed([q]); } catch (e) { return null; }
    if (!data || data.length < DIM) return null;

    const scoreByTopic = Object.create(null);
    for (let i = 0; i < rows.length; i++) {
      let dot = 0;
      const off = i * DIM;
      for (let d = 0; d < DIM; d++) dot += data[d] * vecs[off + d];
      const t = rows[i].topic;
      if (!(t in scoreByTopic) || dot > scoreByTopic[t]) scoreByTopic[t] = dot;
    }
    let top = null, s1 = -1, s2 = -1;
    for (const t in scoreByTopic) {
      const s = scoreByTopic[t];
      if (s > s1) { s2 = s1; s1 = s; top = t; } else if (s > s2) { s2 = s; }
    }
    return { topic: top, score: s1, margin: s1 - (s2 < 0 ? 0 : s2) };
  }

  return {
    init, best,
    ACCEPT, AGREE, VETO, MODEL_ID, LIB_URL,
    get state() { return state; },
    get error() { return lastError; },
    ready: () => state === 'ready',
    onChange: fn => { listeners.push(fn); },
  };
})();

/* ============================================================
   UI. Everything below renders derived state; nothing stores it.
   ============================================================ */
let LOG=[], SEQ=0, T0=Date.now(), ST=null, TAB='history', ENDED=false;
let PENDING_HANDOFF={disposition:null,diagnosis:null};
let LASTNURSE=-1, LASTPHASE=null, ASKTEXT='', DXTEXT='';
/* Filter text and the pending order basket are per tab, so switching tabs and
   coming back leaves both exactly as they were. */
const FILTERS={}, BASKET={};
/* Expanded state for collapsible groups, per tab, so leaving and returning to a tab
   leaves the accordion exactly as it was. */
const EXPANDED={};
const expandedOf = t => (EXPANDED[t]=EXPANDED[t]||new Set());
let MODE='easy', STARTED=false;
/* ---------- panel state ----------
   Two booleans describe the whole layout. The tab rail is fixed and never
   participates: it is on screen in every state, which is what makes closing
   the workspace panel a safe thing to do to the learner.

     LEFT_OPEN   workspace panel out from behind the rail
     RIGHT_WIDE  record panel at 70% of the viewport, workspace closed

   They are written onto <body> as data attributes and the transitions live in
   CSS, so nothing here measures or animates anything by hand. */
let LEFT_OPEN=true, RIGHT_WIDE=false;
const ICON_EXPAND='<path d="M15 4h5v5M20 4l-7 7M9 20H4v-5M4 20l7-7"/>';
const ICON_SHRINK='<path d="M20 9h-5V4M15 9l6-6M4 15h5v5M9 15l-6 6"/>';
function setPanels(leftOpen,rightWide){
  LEFT_OPEN=!!leftOpen; RIGHT_WIDE=!!rightWide;
  document.body.dataset.left  = LEFT_OPEN ? 'open' : 'closed';
  document.body.dataset.right = RIGHT_WIDE ? 'wide' : 'dock';
  const b=el('rp-toggle');
  if(b){
    const lbl=RIGHT_WIDE?'Minimise the chart':'Expand the chart';
    b.title=lbl; b.setAttribute('aria-label',lbl);
    b.setAttribute('aria-expanded',RIGHT_WIDE?'true':'false');
    const ic=el('rp-icon'); if(ic) ic.innerHTML=RIGHT_WIDE?ICON_SHRINK:ICON_EXPAND;
  }
  /* The scroller changes with the state, so the next feed render has to
     re-follow the newest entry rather than leaving the reader at the top of a
     panel they just expanded to read the bottom of. */
  FEED_N=-1;
  if(ST) renderMonitor();
}
/* Expanding is a reading gesture, so it takes the whole width it can get and
   the workspace goes away. Minimising is a return to work, so the workspace
   comes back on Patient rather than on whichever tab was open twenty minutes
   ago: after reading the chart the next question is almost always about the
   patient, not about the tab that happened to be showing. */
function expandRecord(){ if(!RIGHT_WIDE) setPanels(false,true); }
function minimiseRecord(){
  if(!RIGHT_WIDE) return;
  TAB='history'; setPanels(true,false); render();
}
const DM = () => PROTO.difficulty.modes[MODE].prompt_multiplier;
const filterOf = t => FILTERS[t]||'';
const basketOf = t => (BASKET[t]=BASKET[t]||new Set());

/* Label lookups the handoff and debrief need. Plain functions rather than properties
   hung on PROTO, because PROTO is rebound whenever a case is selected and anything
   attached to it would be lost. */
const dxLabel   = id => (SHARED.diagnoses.find(d=>d.id===id)||{}).label
                     || (id?id.replace(/^dx_/,'').replace(/_/g,' '):'not recorded');
const dispLabel = id => (PROTO.dispLabels||{})[id] || (id?id.replace(/_/g,' '):'not recorded');

const now = ()=> ENDED ? ST.now : (STARTED ? (Date.now()-T0)/1000 : 0);
function log(e){ e.seq=SEQ++; e.t=now(); LOG.push(e); refold(); }
function refold(){ ST=fold(LOG,now(),DM()); }

const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mmss = s => { s=Math.max(0,Math.floor(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };
const el = id => document.getElementById(id);

/* ---------- vitals ramp ----------
   The engine changes phase in one step, so before this the monitor jumped: a
   heart rate could go 119 to 92 between two frames. Nothing in a body does
   that, and an instantaneous jump also hides the thing the learner is meant to
   watch for, which is a trend. The numbers now travel to the new phase's
   values over five seconds.

   THIS IS DISPLAY ONLY. It does not touch ST, the fold, or any authored value.
   A study still reports the authored vitals for the moment it was ordered, a
   transition still fires the instant its condition is met, and the debrief is
   unaffected. If this code were deleted the medicine would be identical.

   The ramp starts from what is currently on screen rather than from the
   previous phase's authored numbers, so a second transition landing mid-ramp
   continues smoothly from where the display actually was. */
const RAMP_MS=5000;
const RAMP_KEYS=['heart_rate','systolic_bp','diastolic_bp','oxygen_saturation',
                 'respiratory_rate','temperature_c'];
let RAMP_FROM=null, RAMP_T0=0, RAMP_PHASE=null, RAMP_SHOWN=null;
function resetRamp(){ RAMP_FROM=null; RAMP_T0=0; RAMP_PHASE=null; RAMP_SHOWN=null; }
function rampedVitals(){
  if(!ST||!PHASE) return null;
  const p=PHASE[ST.phase];
  const target=p?p.vitals:null;
  if(!target) return target;
  if(RAMP_PHASE!==ST.phase){
    /* First paint of a case shows the arrival vitals outright: there is nothing
       to travel from, and a five second climb from nowhere would be a lie. */
    RAMP_FROM = (RAMP_PHASE===null||!RAMP_SHOWN) ? target : RAMP_SHOWN;
    RAMP_T0 = Date.now();
    RAMP_PHASE = ST.phase;
  }
  /* The case is over, so show where it ended rather than freezing part way. */
  if(ENDED){ RAMP_SHOWN=target; return target; }
  const k=Math.min(1,Math.max(0,(Date.now()-RAMP_T0)/RAMP_MS));
  const e=k*k*(3-2*k);                      /* smoothstep: no jerk at either end */
  const out={};
  for(const key in target) out[key]=target[key];
  for(const key of RAMP_KEYS){
    const a=RAMP_FROM[key], b=target[key];
    if(typeof a!=='number'||typeof b!=='number') continue;
    const val=a+(b-a)*e;
    out[key] = key==='temperature_c' ? Math.round(val*10)/10 : Math.round(val);
  }
  RAMP_SHOWN=out;
  return out;
}

/* ---------- monitor (section 6, 8.4) ---------- */
function jitter(v,amp){ return v + Math.round((Math.sin(Date.now()/1300+v)+Math.sin(Date.now()/770+v*2))/2*amp); }
function renderMonitor(){
  const p=PHASE[ST.phase];
  const v=rampedVitals()||(p?p.vitals:{})||{};
  const halted = ST.halted||ST.complete||ST.earlyExit;
  const j = halted ? (x=>x) : jitter;
  /* A case still being authored has null vitals. Show a dash rather than crashing:
     the picker offers skeletons on purpose, and a skeleton that white-screens is
     worse than one that reads as obviously unfinished. */
  const num=(x,amp)=>typeof x==='number'?j(x,amp||0):'\u2013';
  const cells=[
    ['HR',   num(v.heart_rate,2),                            'min\u207B\u00B9','hr'],
    ['BP',   (typeof v.systolic_bp==='number'&&typeof v.diastolic_bp==='number')
               ? v.systolic_bp+'/'+v.diastolic_bp : '\u2013',  'mmHg','bp'],
    ['SpO\u2082', num(v.oxygen_saturation,1),                 '%','spo2'],
    ['RR',   num(v.respiratory_rate,1),                      'min\u207B\u00B9','rr'],
    ['T',    typeof v.temperature_c==='number'?v.temperature_c.toFixed(1):'\u2013','\u00B0C','temp']
  ];
  /* The header carries the full monitor at every panel state, so vitals are
     never occluded. The expanded record panel additionally carries a compact
     copy in its own header, because a resident reading two columns of chart at
     70% width should not have to look back up to the top of the window. */
  const mini=el('rp-mini');
  if(mini) mini.innerHTML = RIGHT_WIDE
    ? cells.map(c=>`<span class="m"><span class="k">${c[0]}</span><b class="v-${c[3]}">${c[1]}</b></span>`).join('')
      + `<span class="m"><span class="k">elapsed</span><b>${mmss(ST.now)}</b></span>`
    : '';
  el('monitor').innerHTML = cells.map(c=>
    `<div class="vit"><div class="vitlab">${c[0]}</div>
     <div class="vitval v-${c[3]}">${c[1]}</div><div class="vitunit">${c[2]}</div></div>`).join('')
    + `<div class="clockbox"><div class="vitlab">elapsed</div>
       <div class="clock">${mmss(ST.now)}</div>
       <div class="phasechip">${esc(PROTO.phaseShort[ST.phase]||ST.phase)}</div>
       <div class="phasechip">${esc(PROTO.difficulty.modes[MODE].label)}</div></div>`;
  if(LASTPHASE!==null && LASTPHASE!==ST.phase) el('monitor').animate?.([{opacity:.35},{opacity:1}],{duration:420});
  LASTPHASE=ST.phase;
  /* The trace is decorative: its path does not encode rate, and the argument is
     only a cache key. Feed it the phase's authored rate rather than the ramping
     one so it redraws on a phase change instead of on every frame for five
     seconds. */
  renderTrace(p&&p.vitals?p.vitals.heart_rate:undefined);
  renderSound();
  AUDIO.sync();
}
function renderTrace(hr){
  const svg=el('trace');
  if(typeof hr!=='number'){ svg.innerHTML=''; svg.dataset.hr=''; return; }
  if(svg.dataset.hr===String(hr)) return;
  svg.dataset.hr=String(hr);
  const beats=6, w=420, seg=w/beats; let d='';
  for(let b=0;b<beats;b++){
    const x=b*seg;
    d+=`M${x} 14 L${x+seg*0.30} 14 L${x+seg*0.36} 11 L${x+seg*0.42} 14 `
     + `L${x+seg*0.47} 17 L${x+seg*0.52} 2 L${x+seg*0.57} 20 L${x+seg*0.62} 14 `
     + `L${x+seg*0.78} 14 L${x+seg*0.84} 9 L${x+seg*0.90} 14 L${x+seg} 14 `;
  }
  svg.innerHTML=`<path d="${d}" fill="none" stroke="var(--hr)" stroke-width="1.3"/>`;
}
function renderSound(){
  const b=el('soundbtn'); if(!b) return;
  b.textContent = AUDIO.running ? 'Sound on' : (AUDIO.enabled ? 'Enable sound' : 'Sound off');
  b.setAttribute('aria-pressed', AUDIO.running?'true':'false');

}

/* ---------- nurse ---------- */
function renderNurse(){
  const n=ST.nurse[ST.nurse.length-1];
  const line=el('nurseline');
  if(!n){ line.textContent=PROTO.nurseIdle; el('nursemeta').textContent=''; return; }

    if(LASTNURSE>=0 && n.kind==='prompt') AUDIO.trill();
    LASTNURSE=ST.nurse.length;
  }
  line.textContent=n.text;
  const lab={prompt:'prompt',blocked:'blocked action',result:'result',halt:'halt',narration:''}[n.kind]||'';

}

/* ---------- rail ---------- */
function renderRail(){
  const p=ST.pending;
  el('pendlist').innerHTML = p.length ? p.map(o=>{
    const left=Math.max(0,o.dueT-ST.now), tot=Math.max(0.1,o.dueT-o.orderT);
    return `<div class="pendrow"><span>${esc(dispName(o.id))}</span><span class="cd">${left.toFixed(1)}s</span></div>
            <div class="bar"><i style="width:${Math.min(100,(1-left/tot)*100).toFixed(0)}%"></i></div>`;
  }).join('') : '<div class="emptyline">Nothing pending.</div>';
  renderFeed();
}

/* ---------- running chart ----------
   Everything the case has produced, in the order it arrived: results as they come back,
   exam findings, consultant replies, what the patient said, and every action performed
   or blocked. It is always on screen, because a finding read on one tab is gone the
   moment the resident moves to another and the whole point of a chart is that it is not.

   Results enter the feed at the moment they RESULT, not when they were ordered, so the
   order here is the order the resident actually learned things. */
function feedItems(){
  const out=[];
  for(const x of ST.timeline){
    if(x.type==='blocked'){ out.push({t:x.t,kind:'blocked',name:x.label}); continue; }
    /* Observational entries are already represented by the readout they produced, and
       the interview and review entries would just duplicate it. */
    if(x.type==='observational') continue;
    if(x.type==='end') continue;
    /* A study appears twice: once when it is sent, once when it results. Same name on
       both reads as a duplicate, so the order is labelled as an order. */
    const isStudy=catOf(x.id)==='investigation';
    out.push({t:x.t,kind:x.tag==='harmful'?'harm':(isStudy?'order':'action'),
              name:isStudy?('Ordered: '+x.label):x.label});
  }
  for(const r of ST.readouts){
    if(r.kind==='exam')    out.push({t:r.t,kind:'exam',name:r.title,payload:r.body});
    if(r.kind==='consult') out.push({t:r.t,kind:'consult',name:r.title,body:r.body});
    if(r.kind==='speech')  out.push({t:r.t,kind:'speech',name:r.title,body:r.body});
  }
  Object.keys(ST.orders).forEach(id=>ST.orders[id].forEach(o=>{
    if(o.value===null) return;                      /* still pending, lives in the rail above */
    out.push({t:o.dueT,kind:catOf(id)==='investigation'?'lab':'imaging',
              name:dispName(id),payload:o.value});
  }));
  out.sort((a,b)=>a.t-b.t);
  return out;
}

function feedPayload(v){
  if(!v||typeof v!=='object') return v?`<div class="fb">${esc(v)}</div>`:'';
  if(v.components&&v.components.length)
    return '<table>'+v.components.map(c=>
      `<tr><td class="lb">${esc(c.label)}</td>
           <td class="vl${c.abnormal?' abn':''}">${esc(c.value)}${c.unit?' '+esc(c.unit):''}</td></tr>`
    ).join('')+'</table>'+(v.comment?`<div class="fb">${esc(v.comment)}</div>`:'');
  const txt=v.report||v.findings||v.value||'';
  return txt?`<div class="fb${v.abnormal?' abn':''}">${esc(txt)}</div>`:'';
}

let FEED_N=-1;
function renderFeed(){
  const items=feedItems();
  el('feedcount').textContent = items.length ? items.length : '';
  el('feed').innerHTML = items.length ? items.map(i=>
    `<div class="fitem k-${i.kind}${(i.payload&&i.payload.abnormal)?' abnormal':''}">
       <div class="fh"><span class="ft">${mmss(i.t)}</span><span class="fn">${esc(i.name)}</span></div>
       ${i.payload!==undefined?feedPayload(i.payload):(i.body?`<div class="fb">${esc(i.body)}</div>`:'')}
     </div>`).join('')
    : '<div class="emptyline">Nothing yet.</div>';
  /* Follow the newest entry only when something has actually been added, so a reader
     scrolled back through earlier results is not yanked to the bottom every tick. */
  if(items.length!==FEED_N){
    FEED_N=items.length;
    /* Which element actually scrolls depends on the panel state: docked, the
       feed scrolls inside its box; expanded, the feed is a multi-column block
       of natural height and the panel body around it is the scroller. */
    const f = RIGHT_WIDE ? document.querySelector('.rp-body') : el('feed');
    if(f) f.scrollTop=f.scrollHeight;
  }
}

/* ---------- tab rail ----------
   A fixed vertical rail at the left edge rather than a horizontal strip. It is
   the one element that is on screen in every layout state, so the eight
   destinations stay reachable whether the workspace is open, closed, or hidden
   behind an expanded chart. Icons carry the recognition; the label under each
   one carries the meaning, and the labels are the catalog's own words rather

const TABICON={
  patient:'<circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.6 3.1-5.6 7-5.6s7 2 7 5.6"/>',
  history:'<path d="M20 15a2 2 0 0 1-2 2H8l-4 3V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z"/>',
  exam:'<path d="M6 3v6a4 4 0 0 0 8 0V3"/><path d="M4.5 3h3M12.5 3h3"/>'
      +'<path d="M10 13v1.5A5.5 5.5 0 0 0 15.5 20 3.5 3.5 0 0 0 19 16.5V14"/>'
      +'<circle cx="19" cy="11.6" r="2.2"/>',
  stabilization:'<path d="M3 12h4l2.5-7 4 14L16 12h5"/>',
  investigations:'<path d="M9.5 3h5M10.6 3v5.6L5.3 18.1A2 2 0 0 0 7 21h10a2 2 0 0 0 1.7-2.9L13.4 8.6V3"/>'
      +'<path d="M7.6 15.5h8.8"/>',
  interventions:'<rect x="3.2" y="9" width="17.6" height="6" rx="3" transform="rotate(-45 12 12)"/>'
      +'<path d="M8.8 8.8l6.4 6.4"/>',
  consultations:'<path d="M21 16.9v2.5a1.5 1.5 0 0 1-1.6 1.5A17.6 17.6 0 0 1 3 4.6 1.5 1.5 0 0 1 4.5 3h2.5'
      +'a1.5 1.5 0 0 1 1.5 1.3c.1 1 .3 1.9.6 2.8a1.5 1.5 0 0 1-.3 1.6L7.6 10a14 14 0 0 0 6.4 6.4l1.3-1.2'
      +'a1.5 1.5 0 0 1 1.6-.3c.9.3 1.8.5 2.8.6a1.5 1.5 0 0 1 1.3 1.5z"/>',
  handoff:'<path d="M9.5 4.5H7A1.8 1.8 0 0 0 5.2 6.3v12.9A1.8 1.8 0 0 0 7 21h10a1.8 1.8 0 0 0 1.8-1.8V6.3'
      +'A1.8 1.8 0 0 0 17 4.5h-2.5"/><rect x="9.2" y="2.6" width="5.6" height="3.6" rx="1.1"/>'
      +'<path d="M9.3 13.4l2 2 3.6-3.8"/>'
};
/* The Patient tab is gone. It carried the full authored background: past medical
   history, every home medication, the whole EMS narrative. That is a chart a
   resident would not have on arrival, and handing it over at the start replaced
   the work of taking a history with the work of reading one.

   The case file still carries all of it, because the debrief, the review packet
   and the authoring process all need it. The learner now gets what a resident
   actually gets: two sentences of handover, on the History tab, and everything
   else has to be asked for.

   Filtering here rather than only in the build keeps an older build working: a
   shared payload that still lists the tab will not produce a dead button. */
const HIDDEN_TABS=new Set(['patient']);
const tabList=()=>PROTO.tabOrder.filter(id=>!HIDDEN_TABS.has(id));
function renderTabs(){
  el('tabbar').innerHTML=tabList().map(id=>{
    let badge='';
    if(id==='investigations'&&ST.pending.length) badge=`<span class="badge">${ST.pending.length}</span>`;
    const lab=esc(PROTO.tabLabel[id]);
    return `<button class="tabbtn" role="tab" aria-selected="${id===TAB&&LEFT_OPEN}" data-tab="${id}"
      title="${lab}"><svg viewBox="0 0 24 24" aria-hidden="true">${TABICON[id]||TABICON.patient}</svg>
      <span class="lb">${lab}</span>${badge}</button>`;
  }).join('');
}

/* ---------- result payload rendering: abnormal components in red ---------- */
function renderPayload(v){
  if(v===null||v===undefined) return '<div class="body">No result is defined for this study.</div>';
  if(typeof v==='string') return `<div class="body">${esc(v)}</div>`;
  if(v.kind==='report'){
    return `<div class="body${v.abnormal?' abn-report':''}">${esc(v.report)}</div>`;
  }
  const rows=(v.components||[]).map(c=>
    `<tr class="${c.abnormal?'abn':''}">
       <td class="lab">${esc(c.label)}</td>
       <td class="val">${esc(c.value)}${c.unit?' '+esc(c.unit):''}</td>
       <td class="ref">${esc(c.reference_range||'')}</td>
     </tr>`).join('');
  return `<table class="labtbl">${rows}</table>`
       + (v.comment?`<div class="body" style="margin-top:6px">${esc(v.comment)}</div>`:'')
       + (v.verify?`<div class="verify">Needs verification: ${esc(v.verify)}</div>`:'');
}

/* ---------- action buttons ---------- */
function actionsFor(tab){
  const f=filterOf(tab), out={};
  for(const id in ACT){
    const a=ACT[id];
    if(a.tab!==tab) continue;
    if(f && !(a.name.toLowerCase().includes(f)||id.includes(f))) continue;
    (out[a.group]=out[a.group]||[]).push(id);
  }
  Object.keys(out).forEach(g=>out[g].sort((x,y)=>ACT[x].name.localeCompare(ACT[y].name)));
  return out;
}
function groupNames(tab,groups){
  const fixed=(PROTO.groupOrder||{})[tab]||[];
  const rank=g=>{
    if(g==='Not in the catalog') return 999;
    const i=fixed.indexOf(g);
    return i<0 ? 500 : i;
  };
  return Object.keys(groups).sort((a,b)=>rank(a)-rank(b)||a.localeCompare(b));
}
/* Buttons carry the name and nothing else. Prerequisites and turnaround times used to
   be printed underneath; they are system detail the resident does not read off a menu,
   and a blocked attempt teaches the prerequisite better than a label does. */
function actionButton(id,tab){
  const a=ACT[id];
  const orders=ST.orders[id]||[];
  const last=orders[orders.length-1];
  let cls='ab';
  if(IS_STUDY(id)){
    if(last&&last.value===null) cls+=' pend';
    else if(last) cls+=' hasres';
  } else if(ST.taken.has(id)) cls+=' done';
  if(a.orphan) cls+=' orphan';
  if(tab&&basketOf(tab).has(id)) cls+=' picked';
  return `<button class="${cls}" data-act="${id}" data-tabof="${tab||''}">${esc(a.name)}</button>`;
}
function renderActionTab(tab,intro){
  const groups=actionsFor(tab);
  const names=groupNames(tab,groups);
  const collapsible=(PROTO.collapsibleTabs||[]).includes(tab);
  const open=expandedOf(tab);
  let html='';
  for(const g of names){
    const picked=groups[g].filter(id=>basketOf(tab).has(id)).length;
    if(collapsible){
      const isOpen=open.has(g);
      html+=`<button class="grouphdr" data-group="${esc(g)}" data-tabof="${tab}"
        aria-expanded="${isOpen}"><span class="chev">${isOpen?'\u25BC':'\u25B6'}</span>
        <span>${esc(g)}</span>
        ${picked?`<span class="picks">${picked} selected</span>`:''}
        <span class="n">${groups[g].length}</span></button>`;
      if(!isOpen) continue;
      html+='<div class="groupbody">';
    } else {
      html+=`<h3>${esc(g)}</h3>`;
    }
    if(g==='Not in the catalog')
      html+=`<div class="note" style="border-left-color:var(--harm)">${esc(PROTO.orphanNote)}</div>`;
    html+=`<div class="grid">${groups[g].map(id=>actionButton(id,tab)).join('')}</div>`;
    if(collapsible) html+='</div>';
  }
  if(!names.length) html='<p class="sub">Nothing matches that filter.</p>';
  if(collapsible&&filterOf(tab)) names.forEach(g=>open.add(g));
  const orderable=PROTO.orderableTabs.includes(tab);
  const basket=[...basketOf(tab)];
  return `<div class="panel"><h2>${esc(PROTO.tabLabel[tab])}</h2>
    <p class="sub">${intro}</p>
    <div class="toolbar">
      <span class="searchwrap">
        <input type="text" id="filterbox" class="filter" placeholder="Filter this tab"
          value="${esc(filterOf(tab))}" data-tabof="${tab}">
        ${filterOf(tab)?`<button class="clearfilter" id="clearfilter" data-tabof="${tab}"
          title="Clear the filter" aria-label="Clear the filter">\u00D7</button>`:''}
      </span>
      ${orderable?`<button class="btn" id="submitorder" data-tabof="${tab}" ${basket.length?'':'disabled'}>
          Submit Order${basket.length?' ('+basket.length+')':''}</button>
        <button class="btn ghost" id="clearorder" data-tabof="${tab}" ${basket.length?'':'disabled'}>Clear</button>`:''}
    </div>
    ${orderable?`<div class="basket${basket.length?'':' empty'}">${basket.length
        ? 'Selected, not yet sent: '+basket.map(id=>esc(dispName(id))).join(', ')+'.'
        : 'Nothing selected. Click items to add them, then Submit Order.'}</div>`:''}
    ${html}</div>`;
}

/* ---------- arrival ----------
   Two authored facts, and both are deliberately small.

   WHERE. metadata.arrival.location is one of resuscitation_bay, trauma_bay or
   patient_room. It sets one line on the splash screen and nothing else. It
   tells the learner what kind of room they have walked into, which is real
   information a clinician has before they have any history at all.

   WHO HANDED OVER. metadata.arrival.mode is ems or triage. It only chooses the
   heading above the two-sentence handover, but the difference is worth
   authoring: a paramedic handover and a triage nurse note carry different
   things, and a resident should read them differently.

   The legacy readers below exist because cases authored before this change
   carry a free-text arrival.mode from an older vocabulary ("Ambulance",
   "Walk-in") and no location at all. Rather than break them, the mode is
   normalised and the location is recovered from the arrival line if it names a
   room. A case that says nothing gets no location line rather than a guess. */
const ARRIVAL_ROOM={resuscitation_bay:'Resuscitation Bay',trauma_bay:'Trauma Bay',
                    patient_room:'Patient Room'};
function arrivalRoom(){
  const ar=(CASE.metadata||{}).arrival||{};
  const key=String(ar.location||'').toLowerCase().replace(/[^a-z]+/g,'_');
  if(ARRIVAL_ROOM[key]) return ARRIVAL_ROOM[key];
  const hay=String(ar.line||'').toLowerCase();          /* legacy cases */
  if(hay.includes('resus')) return ARRIVAL_ROOM.resuscitation_bay;
  if(hay.includes('trauma')) return ARRIVAL_ROOM.trauma_bay;
  if(hay.includes('room'))  return ARRIVAL_ROOM.patient_room;
  return null;
}
function arrivalMode(){
  const raw=String(((CASE.metadata||{}).arrival||{}).mode||'').toLowerCase();
  if(/triage|walk|ambulatory/.test(raw)) return 'triage';
  return 'ems';                                          /* including legacy "Ambulance" */
}
function arrivalHandover(){
  const p=CASE.patient||{};
  /* Authored short form first. The long ems_handover_text is retained in the
     case file for the review packet and is deliberately not shown. */
  const short=p.arrival_handover||p.triage_handover;
  if(short) return String(short);
  const line=((CASE.metadata||{}).arrival||{}).line;     /* legacy fallback */
  return line?String(line):'';
}

/* A one-line statement of how the patient is understanding questions right now.
   It is here rather than in the header because this is the only screen where it
   changes what the learner should expect, and because a learner who asks
   "orthopnoea?" and gets a shrug deserves to know whether the patient denied it

   learner needs to know is how well they can expect to be understood. */
function semChip(){

  return `<div class="semchip s-${SEM.state}">

}

const STOP=new Set(('a an the is are was were do does did you your yours he him his i me my of to in on at it '
 +'any have has had can could would will about for with what when how why where which that this and or but '
 +'tell please sir mr been being get got some there their they').split(' '));
function norm(s){ return s.toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w&&!STOP.has(w)); }

/* ============================================================
   CLINICAL LEXICON

   Section 10.4 requires the PATIENT to speak in lay language, and the variant
   banks were written in the same register. Residents do not type in that
   register. Measured on the CHFE bank, 31 of 40 common clinical terms and
   abbreviations appear in none of the 340 variants, so "PND?", "orthopnea?",
   "PMH?" and "NKDA?" scored exactly zero against every topic and fell through
   to the out-of-scope fallback. That is a vocabulary gap, not a scoring
   problem, and no threshold fixes it.

   Each key is a clinical term or abbreviation. Each value is the lay words the
   banks are actually written in, chosen by reading the vocabulary of the
   existing topics rather than guessed, so an expansion lands on words that are
   really there.

   THIS IS CLINICAL CONTENT AND NEEDS A PHYSICIAN'S REVIEW, on the same footing
   as the action catalog. A wrong entry here produces a confident wrong answer,
   which section 10.6 names as the failure mode invisible to the learner. Two
   rules kept the list conservative:

     - No key shorter than two letters that could be a typo of something else.
       "PE" is omitted for that reason, and because it is a diagnosis rather
       than a question.
     - Nothing that would put a diagnosis in the patient's mouth. "chf" maps to
       the words for asking about known history, not to an answer.

   It lives here rather than in the catalog because it is case-independent and
   because engine/matcher_eval.mjs extracts this whole region from the build and
   tests it. When a second case pack exists, move it beside the action catalog
   and load it through SHARED, and update the marker comments in the harness.
   ============================================================ */
const LEXICON={
  /* breathing */
  'pnd':'wake night gasping breath', 'paroxysmal nocturnal dyspnoea':'wake night gasping breath',
  'paroxysmal nocturnal dyspnea':'wake night gasping breath',
  'orthopnea':'lie flat pillows sleep lying down prop', 'orthopnoea':'lie flat pillows sleep lying down prop',
  'dyspnea':'breathless breathing breath short', 'dyspnoea':'breathless breathing breath short',
  'sob':'breathless short breath', 'soboe':'breathless walk stairs exercise',
  'doe':'breathless walk stairs exercise tolerance', 'exertional':'walk stairs exercise tolerance',
  'exertion':'walk stairs exercise tolerance',
  'haemoptysis':'coughed up blood', 'hemoptysis':'coughed up blood',
  'productive':'phlegm sputum coughing up', 'purulent':'phlegm colour sputum',
  'expectorate':'coughing up phlegm', 'expectorating':'coughing up phlegm',
  'osa':'snore breathing sleep night apnoea', 'sleep apnoea':'snore breathing sleep night apnoea',
  'sleep apnea':'snore breathing sleep night apnoea',
  'copd':'chest breathing medical problems history',

  /* circulation */
  'oedema':'swelling swollen legs ankles feet', 'edema':'swelling swollen legs ankles feet',
  'pedal oedema':'swelling swollen ankles feet legs', 'pedal edema':'swelling swollen ankles feet legs',
  'peripheral oedema':'swelling swollen ankles feet legs', 'peripheral edema':'swelling swollen ankles feet legs',
  'syncope':'passed out fainted collapsed blackouts', 'presyncope':'dizzy lightheaded nearly passed out',
  'pleuritic':'chest pain breathing', 'diaphoresis':'sweating sweats',
  'diaphoretic':'sweating sweats', 'claudication':'pain legs walk',
  'dvt':'leg swollen calf pain clot', 'vte':'clot leg travel immobility',
  'htn':'blood pressure', 'ihd':'heart attack', 'cad':'heart attack',
  'mi':'heart attack', 'nstemi':'heart attack', 'stemi':'heart attack',
  'chf':'heart problems medical history', 'ccf':'heart problems medical history',
  'hfref':'heart problems medical history',

  /* abdomen and renal */
  'emesis':'vomiting sick', 'haematemesis':'vomiting blood', 'hematemesis':'vomiting blood',
  'anorexia':'appetite eat eating', 'ascites':'bloated belly swelling abdomen distended',
  'oliguria':'passing urine less output', 'anuria':'passing urine output',
  'polyuria':'passing urine often more', 'nocturia':'urine night toilet passing',
  'ckd':'kidney medical problems',

  /* history taking, the sections residents name by abbreviation */
  'pmh':'medical problems history conditions diagnosed', 'pmhx':'medical problems history conditions diagnosed',
  'psh':'operations surgery procedures', 'pshx':'operations surgery procedures',
  'fhx':'family history parents siblings', 'shx':'smoke drink alcohol tobacco',
  'meds':'medications tablets medicines', 'medication':'medications tablets medicines',
  'compliance':'taking medications missed tablets doses prescribed',
  'adherence':'taking medications missed tablets doses prescribed',
  'concordance':'taking medications missed tablets doses prescribed',
  'nkda':'allergies allergic drug', 'allergy':'allergies allergic',
  'npo':'last eat drink food', 'nbm':'last eat drink food',
  'etoh':'alcohol drink', 'ivdu':'drugs recreational street use',
  'pwid':'drugs recreational street use', 'pack years':'cigarettes smoke day many',
  'pack year':'cigarettes smoke day many',
  'adls':'normally manage walk stairs shopping', 'functional status':'normally manage walk stairs shopping',

  /* infection and exposure */
  'sick contacts':'anyone ill sick unwell around', 'uri':'cold sore throat runny nose flu',
  'urti':'cold sore throat runny nose flu', 'lrti':'chest infection cough',
  'pyrexia':'fever temperature', 'pyrexial':'fever temperature', 'febrile':'fever temperature',
  'rigors':'chills shivering shakes',

  /* drugs the resident will name where the patient would not */
  'water pill':'water tablet diuretic medications', 'water tablet':'water tablet diuretic medications',
  'diuretic':'water tablet medications', 'furosemide':'water tablet diuretic medications',
  'frusemide':'water tablet diuretic medications', 'lasix':'water tablet diuretic medications',
  'sodium':'salt salty diet', 'dietary sodium':'salt salty diet eating'
