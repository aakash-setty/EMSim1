0", "abnormal": true}, {"label": "Creatinine", "value": "1.62", "unit": "mg/dL", "reference_range": "0.6-1.2; stated baseline 1.4", "abnormal": true}, {"label": "Glucose", "value": "172", "unit": "mg/dL", "reference_range": "70-140 (random)", "abnormal": true}, {"label": "Calcium", "value": "8.8", "unit": "mg/dL", "reference_range": "8.5-10.2", "abnormal": false}]}, "prose": "Sodium 133 mmol/L (low). Potassium 4.4 mmol/L. Chloride 96 mmol/L. Bicarbonate 25 mmol/L. Urea nitrogen 32 mg/dL (high). Creatinine 1.62 mg/dL (high; stated baseline 1.4). Glucose 172 mg/dL (high). Calcium 8.8 mg/dL."}], "result_shape": "structured"}, "labs_bnp": {"changes_with_state": false, "rules": [{"when": null, "value": {"kind": "value", "abnormal": true, "components": [{"label": "B-type natriuretic peptide", "value": "2840", "unit": "pg/mL", "reference_range": "under 100", "abnormal": true}], "verify": "The catalog entry this binds to is pro-BNP, a different assay with a different reference interval. Either the number is rewritten for pro-BNP or a BNP entry is added to the catalog. UNVERIFIED."}, "prose": "B-type natriuretic peptide 2840 pg/mL (high; reference under 100)."}], "result_shape": "structured"}, "labs_troponin_hs": {"changes_with_state": false, "rules": [{"when": null, "value": {"kind": "value", "abnormal": true, "components": [{"label": "High-sensitivity troponin I", "value": "62", "unit": "ng/L", "reference_range": "99th percentile URL 34 (M)", "abnormal": true}], "verify": "The catalog default for the bound entry is a qualitative troponin T. Assay, analyte and reference interval all differ. UNVERIFIED."}, "prose": "High-sensitivity troponin I 62 ng/L (high; 99th percentile upper reference limit 34 ng/L for men)."}], "engine_limitation_note": "A serial troponin is the clinically important manoeuvre here and this engine cannot represent it. A second order in an unchanged state resolves to the same value, and the condition language has no way to express 'the second time this was ordered'. A delta could be faked by gating on an unrelated flag, which would be dishonest. Flagged in the review packet as a genuine expressive gap; in the debrief the case teaches the principle instead.", "result_shape": "structured"}, "labs_vbg": {"changes_with_state": true, "rules": [{"when": "phase is post_intubation_hypotension", "value": {"kind": "panel", "abnormal": true, "components": [{"label": "pH (venous)", "value": "7.24", "unit": "", "reference_range": "7.31-7.41 (venous)", "abnormal": true}, {"label": "pCO2", "value": "46", "unit": "mmHg", "reference_range": "41-51 (venous)", "abnormal": false}, {"label": "Bicarbonate", "value": "19", "unit": "mEq/L", "reference_range": "22-26", "abnormal": true}, {"label": "Base excess", "value": "-7", "unit": "mEq/L", "reference_range": "-2 to +2", "abnormal": true}, {"label": "Lactate", "value": "3.4", "unit": "mmol/L", "reference_range": "under 2.0", "abnormal": true}], "comment": "Metabolic acidosis with an inadequate respiratory response on current ventilator settings."}, "prose": "Venous pH 7.24 (low). pCO2 46 mmHg. Bicarbonate 19 mmol/L (low). Base excess -7. Lactate 3.4 mmol/L (high). Metabolic acidosis with an inadequate respiratory response on current ventilator settings."}, {"when": "phase is intubated_stabilized", "value": {"kind": "panel", "abnormal": true, "components": [{"label": "pH (venous)", "value": "7.32", "unit": "", "reference_range": "7.31-7.41 (venous)", "abnormal": false}, {"label": "pCO2", "value": "42", "unit": "mmHg", "reference_range": "41-51 (venous)", "abnormal": false}, {"label": "Bicarbonate", "value": "22", "unit": "mEq/L", "reference_range": "22-26", "abnormal": false}, {"label": "Base excess", "value": "-3", "unit": "mEq/L", "reference_range": "-2 to +2", "abnormal": true}, {"label": "Lactate", "value": "2.2", "unit": "mmol/L", "reference_range": "under 2.0", "abnormal": true}], "comment": "Improving."}, "prose": "Venous pH 7.32 (low). pCO2 42 mmHg. Bicarbonate 22 mmol/L. Base excess -3. Lactate 2.2 mmol/L (high). Improving."}, {"when": "flag on_niv set", "value": {"kind": "panel", "abnormal": false, "components": [{"label": "pH (venous)", "value": "7.36", "unit": "", "reference_range": "7.31-7.41 (venous)", "abnormal": false}, {"label": "pCO2", "value": "44", "unit": "mmHg", "reference_range": "41-51 (venous)", "abnormal": false}, {"label": "Bicarbonate", "value": "25", "unit": "mEq/L", "reference_range": "22-26", "abnormal": false}, {"label": "Base excess", "value": "0", "unit": "mEq/L", "reference_range": "-2 to +2", "abnormal": false}, {"label": "Lactate", "value": "1.4", "unit": "mmol/L", "reference_range": "under 2.0", "abnormal": false}], "comment": "The respiratory acidosis has corrected."}, "prose": "Venous pH 7.36. pCO2 44 mmHg. Bicarbonate 25 mmol/L. Base excess 0. Lactate 1.4 mmol/L. The respiratory acidosis has corrected."}, {"when": null, "value": {"kind": "panel", "abnormal": true, "components": [{"label": "pH (venous)", "value": "7.29", "unit": "", "reference_range": "7.31-7.41 (venous)", "abnormal": true}, {"label": "pCO2", "value": "54", "unit": "mmHg", "reference_range": "41-51 (venous)", "abnormal": true}, {"label": "Bicarbonate", "value": "25", "unit": "mEq/L", "reference_range": "22-26", "abnormal": false}, {"label": "Base excess", "value": "-1", "unit": "mEq/L", "reference_range": "-2 to +2", "abnormal": false}, {"label": "Lactate", "value": "2.1", "unit": "mmol/L", "reference_range": "under 2.0", "abnormal": true}], "comment": "Acute respiratory acidosis."}, "prose": "Venous pH 7.29 (low). pCO2 54 mmHg (high). Bicarbonate 25 mmol/L. Base excess -1. Lactate 2.1 mmol/L (high). Acute respiratory acidosis."}], "author_note": "Phase rules must precede the on_niv flag rule. Flags are permanent, so a patient who received non-invasive ventilation before being intubated still carries on_niv during the hypotensive phase, and keying the improved gas on that flag alone returned a normal pH for a shocked patient. This is the clearest instance in this case of the permanent-flag limitation producing a clinically wrong result.", "result_shape": "structured"}, "labs_lactate": {"changes_with_state": true, "rules": [{"when": "phase is post_intubation_hypotension", "value": {"kind": "value", "abnormal": true, "components": [{"label": "Lactate", "value": "3.4", "unit": "mmol/L", "reference_range": "under 2.0", "abnormal": true}]}, "prose": "Lactate 3.4 mmol/L (high)."}, {"when": "phase is intubated_stabilized", "value": {"kind": "value", "abnormal": true, "components": [{"label": "Lactate", "value": "2.2", "unit": "mmol/L", "reference_range": "under 2.0", "abnormal": true}], "comment": "Falling."}, "prose": "Lactate 2.2 mmol/L (high), falling."}, {"when": "flag on_niv set", "value": {"kind": "value", "abnormal": false, "components": [{"label": "Lactate", "value": "1.4", "unit": "mmol/L", "reference_range": "under 2.0", "abnormal": false}]}, "prose": "Lactate 1.4 mmol/L."}, {"when": null, "value": {"kind": "value", "abnormal": true, "components": [{"label": "Lactate", "value": "2.1", "unit": "mmol/L", "reference_range": "under 2.0", "abnormal": true}]}, "prose": "Lactate 2.1 mmol/L (high)."}], "author_note": "Rule order matters here and the first draft got it wrong. The post-intubation hypotensive phase must be tested before anything else, because perfusion genuinely falls there and a normal lactate in that phase would be clinically wrong. The earlier draft keyed the top rule on a post-intubation sedation flag, which shadowed the hypotensive phase for any patient who was both sedated and hypotensive. Found by reading the generated review matrix.", "result_shape": "structured"}, "labs_lft": {"changes_with_state": false, "rules": [{"when": null, "value": {"kind": "panel", "abnormal": true, "components": [{"label": "AST", "value": "46", "unit": "U/L", "reference_range": "10-40", "abnormal": true}, {"label": "ALT", "value": "41", "unit": "U/L", "reference_range": "7-40", "abnormal": true}, {"label": "Alkaline phosphatase", "value": "132", "unit": "U/L", "reference_range": "40-129", "abnormal": true}, {"label": "Total bilirubin", "value": "1.4", "unit": "mg/dL", "reference_range": "0.2-1.2", "abnormal": true}, {"label": "Albumin", "value": "3.6", "unit": "g/dL", "reference_range": "3.5-5.0", "abnormal": false}], "comment": "Pattern consistent with hepatic congestion."}, "prose": "Aspartate aminotransferase 46 U/L (high). Alanine aminotransferase 41 U/L (high). Alkaline phosphatase 132 U/L (high). Total bilirubin 1.4 mg/dL (high). Albumin 3.6 g/dL. Pattern consistent with hepatic congestion."}], "result_shape": "structured"}, "labs_dimer": {"changes_with_state": false, "rules": [{"when": null, "value": {"kind": "value", "abnormal": true, "components": [{"label": "D-dimer", "value": "0.94", "unit": "mcg/mL FEU", "reference_range": "under 0.50", "abnormal": true}]}, "prose": "D-dimer 0.94 mcg/mL FEU (high; reference under 0.50)."}], "result_shape": "structured"}}, "imaging": {"authoring_note": "Results freeze at the state in which the study was ordered.", "cxr_portable": {"changes_with_state": true, "rules": [{"when": "flag intubated set", "value": {"kind": "report", "abnormal": true, "report": "Portable AP chest. Endotracheal tube tip approximately 4 cm above the carina, satisfactory position. Cardiomegaly with a cardiothoracic ratio above 0.6. Upper zone vascular redistribution, bilateral perihilar interstitial opacification with Kerley B lines at both bases. Small bilateral pleural effusions blunting both costophrenic angles. No pneumothorax. No focal consolidation."}}, {"when": null, "value": {"kind": "report", "abnormal": true, "report": "Portable AP chest. Cardiomegaly with a cardiothoracic ratio above 0.6. Upper zone vascular redistribution, bilateral perihilar interstitial opacification with Kerley B lines at both bases. Small bilateral pleural effusions blunting both costophrenic angles. No pneumothorax. No focal consolidation. No endotracheal tube present."}}], "result_shape": "structured"}, "ecg_12_lead": {"changes_with_state": true, "rules": [{"when": "phase is post_intubation_hypotension", "value": {"kind": "report", "abnormal": true, "report": "Sinus tachycardia at 128. Left ventricular hypertrophy by voltage criteria. Q waves in V1 to V4 with associated T wave inversion, unchanged in morphology from the earlier tracing. No acute ST elevation and no new ST depression. QTc 456 ms."}}, {"when": "phase is improving OR phase is intubated_stabilized", "value": {"kind": "report", "abnormal": true, "report": "Sinus rhythm at 94. Left ventricular hypertrophy by voltage criteria. Q waves in V1 to V4 with T wave inversion, unchanged. No acute ST elevation. QTc 448 ms."}}, {"when": null, "value": {"kind": "report", "abnormal": true, "report": "Sinus tachycardia at 116. Left ventricular hypertrophy by voltage criteria. Q waves in V1 to V4 with associated T wave inversion, consistent with an established anterior infarct. No acute ST elevation, no new ST depression, no reciprocal change. No atrial fibrillation or flutter. QTc 452 ms."}}], "result_shape": "structured"}, "pocus_lung_cardiac": {"changes_with_state": true, "rules": [{"when": "phase is post_intubation_hypotension", "value": {"kind": "report", "abnormal": true, "report": "Lung: diffuse B lines in all anterior and lateral zones bilaterally. Cardiac: severely reduced left ventricular systolic function with a small underfilled appearance in systole, no pericardial effusion, right ventricle not dilated. Inferior vena cava remains dilated at 2.2 cm with minimal respiratory variation, unchanged despite the hypotension."}}, {"when": "flag diuretic_given set", "value": {"kind": "report", "abnormal": true, "report": "Lung: B lines still present in all zones but reduced in density anteriorly compared with the earlier study. Cardiac: severely reduced left ventricular systolic function, visually consistent with an ejection fraction in the mid twenties. No pericardial effusion. Right ventricle not dilated, no septal flattening. Inferior vena cava 2.1 cm with minimal respiratory variation."}}, {"when": null, "value": {"kind": "report", "abnormal": true, "report": "Lung: three or more B lines per field in all anterior and lateral zones bilaterally, with small bilateral pleural effusions. No lung sliding abnormality, no pneumothorax. Cardiac: severely reduced left ventricular systolic function, visually consistent with an ejection fraction in the mid twenties, globally hypokinetic with anterior wall akinesis. No pericardial effusion. Right ventricle not dilated and no septal flattening. Inferior vena cava 2.3 cm with minimal respiratory variation."}}], "result_shape": "structured"}, "ct_pulmonary_angiogram": {"changes_with_state": false, "rules": [{"when": null, "value": {"kind": "report", "abnormal": false, "report": "No filling defect in the pulmonary arterial tree to the segmental level. No pulmonary embolism. Cardiomegaly. Bilateral dependent ground glass opacification with smooth interlobular septal thickening and small bilateral pleural effusions, consistent with pulmonary oedema. Coronary artery calcification. No consolidation, no mass."}}], "result_shape": "structured"}, "echo_formal": {"changes_with_state": false, "rules": [{"when": null, "value": {"kind": "report", "abnormal": true, "report": "Cardiology sonography reports that no sonographer is available for a formal study within the emergency department timeframe. The study is booked for the inpatient team in the morning."}}], "result_shape": "structured"}}, "consultants": {"authoring_note": "Rules are ordered most specific to least specific: deteriorated phase first, then definitive advice once the key studies have resulted, then a holding response while they are pending, then a default that asks for the workup that has not happened. Unrelated consultants are not authored and inherit the global response.", "consult_cardiology": [{"when": "phase is post_intubation_hypotension", "value": "Cardiology fellow: that is a very different patient from the one you described. If he dropped his pressure straight after induction, my first thoughts are the induction agent, the positive pressure, and whatever vasodilator you still have running. Turn the nitrate off and get a pressor going, norepinephrine rather than epinephrine. I am not taking him to the catheter laboratory on that ECG. Get him a bed in intensive care and I will see him there."}, {"when": "study ecg_12_lead resulted AND study labs_troponin_hs resulted", "value": "Cardiology fellow: I have looked at the tracing. That anterior Q wave pattern is his old infarct, there is no acute ST elevation and nothing new, so this is not a catheter laboratory activation. A troponin in that range is what I would expect from demand in a decompensated ventricle, and I would not chase it as an acute coronary syndrome unless the story changes. This sounds like straightforward volume and afterload decompensation, most likely because he stopped his diuretic. Keep going with positive pressure and the nitrate, diurese him properly, and hold off restarting his carvedilol until he is dry and stable. Admit him somewhere monitored, we will see him on the ward round, and he needs a repeat echocardiogram this admission."}, {"when": "study ecg_12_lead resulted AND study labs_troponin_hs ordered", "value": "Cardiology fellow: I have the tracing up. No acute ST elevation, and that anterior Q wave pattern is his old infarct rather than anything new, so I am not activating the laboratory on this. Your troponin has not landed on my screen yet. Send it through when it does. It will not change my answer unless it is very high, because a modest rise is expected in a decompensated ventricle, but I would like to see it before I commit."}, {"when": "study ecg_12_lead resulted", "value": "Cardiology fellow: I have the tracing up. No acute ST elevation, the anterior Q waves are his old infarct, and there is no arrhythmia to explain this. That is not a catheter laboratory case from where I am sitting. I do not see a troponin ordered on him at all though. Send one, because I want to know whether there is a demand injury sitting underneath this before I sign off on it."}, {"when": "study ecg_12_lead ordered", "value": "Cardiology fellow: I can see an ECG has been requested but there is no tracing on my screen yet, and I am not going to commit before I have seen it. Call me the moment it is up. In the meantime, if he is that hypertensive and that wet, keep the positive pressure on and keep working on the afterload."}, {"when": null, "value": "Cardiology fellow: whatever else you have sent, I cannot tell you whether this is ischaemic without a twelve lead, and there is not one on him. Get one done and call me back. If you want my instinct in the meantime, a known cardiomyopathy who has stopped his diuretic and gained weight is usually exactly what it looks like, but I am not saying that on the phone without a tracing."}], "consult_critical_care": [{"when": "phase is post_intubation_hypotension", "value": "Intensivist: yes, we will take him. While you are waiting: stop the nitrate, start norepinephrine peripherally through your best cannula rather than waiting on a central line, and do not give him fluid, he is overloaded not dry. Have a look at your PEEP as well, it is doing useful work on the oedema but it is also part of why his pressure is down. Make sure he is properly sedated, he has had rocuronium."}, {"when": "flag on_niv set AND flag nitro_infusion_running set", "value": "Intensivist: that is the right treatment and he sounds like he is responding. He will need a bed that can keep the mask on and keep titrating the nitrate, so that is us or the coronary care unit depending on who has space. We will take him. Keep an eye on his pressure while the nitrate is running and let us know if he tires rather than improves."}, {"when": "flag on_niv set", "value": "Intensivist: good, the mask is the right move. What are you doing about his pressure? At 188 systolic with that much fluid on his chest he needs afterload reduction as well as positive pressure. Get something running for that and we will find him a bed."}, {"when": null, "value": "Intensivist: tell me what you have actually done for his breathing so far. If he is at 87 percent on a cannula and working that hard, the first question is whether he is on positive pressure yet, and from what you are describing he is not. Sort that first and call me back with what happens."}], "consult_nephrology": [{"when": "study labs_bmp resulted", "value": "Nephrology fellow: I have seen the chemistry. A creatinine of 1.6 against a baseline of 1.4 in a congested patient is not an indication for anything from us. That is cardiorenal, and it is mostly venous congestion transmitted back to the kidney rather than poor forward flow. The treatment is to decongest him, and his creatinine may well rise a little while you do that, which is expected and is not a reason to stop. There is no hyperkalaemia, no severe acidosis, no uraemic complication. Call us back if he genuinely does not respond to diuresis."}, {"when": "study labs_bmp ordered", "value": "Nephrology fellow: I cannot advise before I have seen a chemistry panel. I can see one has been sent but there is no result on my screen. What is his potassium, and is he making urine? Call me when the numbers are back."}, {"when": null, "value": "Nephrology fellow: I have no numbers at all on this patient. Send a basic chemistry panel and tell me what his urine output has been, then call me back."}]}, "general_status": {"authoring_note": "Rendered above the exam list. Not a clickable action, so it has no catalog entry and cannot be omitted by the learner. The catalog supplies a default for it the same way it does for the manoeuvres.", "rules": [{"when": "phase is post_intubation_hypotension", "value": {"kind": "general_status", "abnormal": true, "findings": "Intubated and sedated. Not responsive. Mottled and cool peripherally."}}, {"when": "phase is intubated_stabilized", "value": {"kind": "general_status", "abnormal": true, "findings": "Intubated and sedated on the ventilator. Colour improved, peripherally warm."}}, {"when": "phase is presentation", "value": {"kind": "general_status", "abnormal": true, "findings": "Severe respiratory distress. Upright, sweating, speaking in short bursts. GCS 15."}}, {"when": "phase is stabilizing", "value": {"kind": "general_status", "abnormal": true, "findings": "Moderate respiratory distress, improving on the mask. Speaking in short sentences. GCS 15."}}, {"when": null, "value": {"kind": "general_status", "abnormal": true, "findings": "Comfortable at rest on the mask. Talking in full sentences. GCS 15."}}]}}, "interview": {"authoring_notes": {"alertness_gating": "Section 10.5 asks for alertness gating authored once as a global rule. The condition language has no alertness predicate, so alertness must be reached indirectly through the phases that carry it. The global rule below enumerates the two phases in this case where alertness level is 3. Flagged in the review packet as a language gap.", "breathlessness_gating": "Section 10.5 covers alertness but not speech limited by respiratory distress. This patient is fully alert in the presentation phase and can answer, but only in short bursts. That could not be done as a global rule without suppressing all topic content, so every topic carries its own presentation-phase answer. Ellipses mark where he stops to breathe.", "interview_during_niv": "In the stabilizing phase the patient has a mask on his face. The answers assume the mask is lifted briefly, which is what actually happens at the bedside. This is deliberately not modelled as a barrier, because penalising a resident for correctly applying non-invasive ventilation before taking a history would teach the wrong lesson. The debrief note on history timing carries the real teaching point instead.", "diagnosis_disclosure": "Section 10.4 forbids the patient from stating or implying the diagnosis. He does describe his known chronic history in lay terms, including that his heart was damaged by a previous infarct, because that is required past medical history content and a real patient would volunteer it. He never attributes the current episode to a cause and never uses the words heart failure. This line is a judgement call and is flagged for the reviewing physician.", "coverage_exceptions": "Pregnancy status is not authored; the patient is a 65 year old man and section 10.2 requires it only where applicable. Code status and goals of care are not authored, though they are a defensible conversation in an admission for decompensated heart failure; noted as a possible addition."}, "global_answer_rules": [{"when": "phase is post_intubation_hypotension OR phase is intubated_stabilized", "value": "He is intubated and sedated. He does not respond to your voice and cannot give any history.", "note": "Prepended to every topic's rule list. Corresponds to alertness level 3."}], "out_of_scope_fallback": [{"when": "phase is presentation", "value": "He looks at you, still pulling hard for each breath, and shakes his head. 'I don't... sorry... I don't know.'"}, {"when": null, "value": "He shakes his head slowly. 'I'm sorry, doctor, I'm not sure what you're getting at there.'"}], "topics": [{"topic": "onset", "canonical": "When did this start?", "variants": ["When did the breathing get bad?", "How long has this been going on?", "When did it start?", "How long have you been short of breath?", "When did you first notice it?", "How many days has this been happening?", "Did this come on suddenly or gradually?", "When did the symptoms begin?", "How long has your breathing been like this?", "What time did it get bad today?"], "answer": [{"when": "phase is presentation", "value": "'Three, four days... much worse... since about four this morning.'"}, {"when": null, "value": "'It's been building for three or four days. I was getting puffed just walking to the kitchen. Then about four this morning I woke up and couldn't get my breath at all, and it hasn't let up since.'"}]}, {"topic": "timing_progression", "canonical": "Has it been getting worse, better, or staying the same?", "variants": ["Is it getting worse?", "How has it changed over time?", "Has it been progressive?", "Is it worse than it was yesterday?", "Has it come and gone or been constant?", "Is it steadily worsening?", "How has it progressed?", "Has anything changed since it started?", "Is it constant or intermittent?", "Was it worse today than the day before?"], "answer": [{"when": "phase is presentation", "value": "'Worse... every day. Terrible... since four this morning.'"}, {"when": null, "value": "'It's got worse every single day. Monday I could still do the stairs if I stopped halfway up. By yesterday I couldn't do them at all. This morning was the worst it's been.'"}]}, {"topic": "character_of_dyspnea", "canonical": "What does the breathing feel like?", "variants": ["Can you describe the breathlessness?", "What's it like when you can't breathe?", "How would you describe it?", "What does it feel like?", "Is it tightness or is it not getting air in?", "Describe the sensation for me", "What's the feeling in your chest?", "Is it hard to breathe in or out?", "How does the breathlessness feel?", "Tell me what it feels like"], "answer": [{"when": "phase is presentation", "value": "'Like drowning... can't get it in... weight on my chest.'"}, {"when": null, "value": "'Like I can't get enough in. There's a heaviness on my chest, like something's sat on it, and no matter how hard I pull I don't get a proper breath.'"}]}, {"topic": "severity", "canonical": "How bad is it, out of ten?", "variants": ["How severe is it?", "On a scale of one to ten how bad?", "Is this the worst it's been?", "How bad is the breathing right now?", "Rate it for me out of ten", "How much is this bothering you?", "Have you had it this bad before?", "Is this worse than your usual episodes?", "How would you score it?", "How bad is it at the moment?"], "answer": [{"when": "phase is presentation", "value": "'Ten... worst ever.'"}, {"when": null, "value": "'Right now? A ten. I've had bad turns before but never anything like this one.'"}]}, {"topic": "aggravating_factors", "canonical": "What makes it worse?", "variants": ["Does anything make it worse?", "What brings it on?", "Is there anything that sets it off?", "What makes the breathing worse?", "Does moving make it worse?", "Does lying down affect it?", "What aggravates it?", "Is it worse with exertion?", "Anything that triggers it?", "When is it at its worst?"], "answer": [{"when": "phase is presentation", "value": "'Lying down... and moving.'"}, {"when": null, "value": "'Lying flat makes it much worse, straight away. And moving about. Even getting to the bathroom sets it off now.'"}]}, {"topic": "relieving_factors", "canonical": "What makes it better?", "variants": ["Does anything help?", "What relieves it?", "Have you found anything that eases it?", "Does sitting up help?", "What makes the breathing easier?", "Anything that settles it?", "Have you tried anything for it?", "Does rest help?", "What improves it?", "Is there anything that gives you relief?"], "answer": [{"when": "phase is presentation", "value": "'Sitting up... that's all.'"}, {"when": null, "value": "'Sitting up. That's about the only thing. I've been sleeping in the armchair the last two nights because it's the only way I get any rest at all.'"}]}, {"topic": "orthopnea", "canonical": "How many pillows do you sleep on?", "variants": ["Can you lie flat?", "Do you need to prop yourself up to sleep?", "How many pillows at night?", "Does lying down make you breathless?", "Can you sleep flat in bed?", "Has your sleeping position changed?", "Do you have to sit up at night?", "Are you sleeping in a chair?", "Do you get breathless when you lie down?", "How do you sleep at night?"], "answer": [{"when": "phase is presentation", "value": "'Four pillows... chair last night.'"}, {"when": null, "value": "'Normally two pillows. The last few nights I've needed four and even then I had to sit right up. Last night I gave up on the bed altogether and slept in the armchair.'"}]}, {"topic": "paroxysmal_nocturnal_dyspnea", "canonical": "Do you wake in the night gasping for breath?", "variants": ["Do you wake up short of breath at night?", "Have you woken up gasping?", "Do you wake suddenly unable to breathe?", "Any night-time breathing attacks?", "Do you have to get out of bed to breathe?", "Have you woken up suffocating?", "Any episodes waking you from sleep?", "Do you wake up fighting for air?", "Does your breathing wake you at night?", "Have you had to go to the window at night?"], "answer": [{"when": "phase is presentation", "value": "'Twice... woke up gasping.'"}, {"when": null, "value": "'Twice this week I've woken in the middle of the night absolutely gasping, like I was being suffocated. I had to get to the window and hang on to the sill a good few minutes before it settled.'"}]}, {"topic": "leg_swelling", "canonical": "Have your legs been swelling?", "variants": ["Any swelling in your legs?", "Have your ankles been puffy?", "Is there swelling in your feet?", "Have you noticed your legs getting bigger?", "Any oedema in your legs?", "Are your shoes or socks tight?", "Has there been swelling anywhere?", "Are both legs swollen?", "Any puffiness in your ankles?", "Have your legs changed at all?"], "answer": [{"when": "phase is presentation", "value": "'Both legs up... socks cutting in.'"}, {"when": null, "value": "'They have. My socks leave marks by the evening and my slippers won't go on properly any more. It's both legs the same.'"}]}, {"topic": "weight_gain", "canonical": "Has your weight changed recently?", "variants": ["Have you put on weight?", "Do you weigh yourself?", "Any weight gain lately?", "How much are you up on your usual weight?", "Has the sca lol I think it is. There's a newer heart one they started me on a couple of years back, sacubitril something, big tablet. A little white one, spironolactone. Metformin for the diabetes and another new one for the diabetes that they said was good for the heart as well. A statin at night and a baby aspirin in the morning.'"}]}, {"topic": "past_medical_history", "canonical": "What medical problems do you have?", "variants": ["What's your past medical history?", "Do you have any health conditions?", "Have you had any heart problems?", "What have you been diagnosed with?", "Any history of heart attack?", "Do you have diabetes or blood pressure?", "What conditions do you see the doctor for?", "Any kidney problems?", "Have you been in hospital before?", "What's your medical background?"], "answer": [{"when": "phase is presentation", "value": "'Heart attack... six years back. Blood pressure. Diabetes.'"}, {"when": null, "value": "'I had a heart attack six years ago and they put a stent in. They told me afterwards the heart doesn't pump the way it should since then. I've got the high blood pressure, and the diabetes, tablets not the injections. And they've said my kidneys aren't brilliant, though I've never had to do anything about that.'"}]}, {"topic": "past_surgical_history", "canonical": "Have you had any operations?", "variants": ["Any surgery in the past?", "Have you had procedures done?", "Any operations at all?", "Have you had a stent or bypass?", "What surgery have you had?", "Any time under anaesthetic?", "Have you had anything removed?", "Any cardiac procedures?", "Have you been operated on?", "What's your surgical history?"], "answer": [{"when": "phase is presentation", "value": "'Stent... and gallbladder.'"}, {"when": null, "value": "'Just the stent when I had the heart attack, and they took my gallbladder out years back. That's the lot.'"}]}, {"topic": "allergies", "canonical": "Do you have any allergies?", "variants": ["Any drug allergies?", "Are you allergic to anything?", "Any reactions to medications?", "Do you have any allergies to medicines?", "Any adverse drug reactions?", "Have you ever reacted to a drug?", "Any food or drug allergies?", "Is there anything you can't take?", "Any known allergies?", "Have you had a reaction to penicillin?"], "answer": [{"when": "phase is presentation", "value": "'No allergies.'"}, {"when": null, "value": "'No, nothing. I've never had a reaction to anything.'"}]}, {"topic": "social_history_smoking_alcohol", "canonical": "Do you smoke or drink alcohol?", "variants": ["Have you ever smoked?", "How much do you drink?", "Are you a smoker?", "When did you stop smoking?", "How many cigarettes a day?", "Do you drink alcohol?", "What's your smoking history?", "How much alcohol in a week?", "Any tobacco use?", "Do you still smoke?"], "answer": [{"when": "phase is presentation", "value": "'Stopped smoking... six years ago. Beer at weekends.'"}, {"when": null, "value": "'I smoked a long time, about a pack a day from my twenties. I packed it in the day I had the heart attack and I've not touched one since. I have a beer at the weekend, maybe two. That's all I drink.'"}]}, {"topic": "substance_use_stimulants", "canonical": "Do you use any recreational drugs?", "variants": ["Any street drugs?", "Have you used cocaine?", "Any recreational drug use?", "Do you take anything not prescribed?", "Any stimulants?", "Have you used methamphetamine?", "Any drug use at all?", "Do you use anything else?", "Have you ever taken cocaine?", "Any non-prescribed substances?"], "answer": [{"when": "phase is presentation", "value": "'No... never.'"}, {"when": null, "value": "'No. Nothing like that, never have done. No cocaine, nothing of that sort.'"}], "pertinent_negative": true}, {"topic": "family_history", "canonical": "Any heart problems in the family?", "variants": ["What's your family history?", "Did your parents have heart trouble?", "Any family history of heart disease?", "Do your siblings have health problems?", "Any sudden deaths in the family?", "Did anyone in your family have a heart attack?", "Any family history of diabetes?", "What did your parents die of?", "Any inherited conditions?", "Is there heart disease in the family?"], "answer": [{"when": "phase is presentation", "value": "'Dad... heart attack. Brother too.'"}, {"when": null, "value": "'My dad had a heart attack in his fifties, and another one that took him. My brother's got the same trouble with his heart as me. My mum had the diabetes.'"}]}, {"topic": "last_oral_intake", "canonical": "When did you last eat or drink?", "variants": ["What was your last meal?", "When did you last have anything?", "Have you eaten today?", "When did you last drink something?", "What time did you last eat?", "Have you had breakfast?", "Anything to eat this morning?", "When was your last food?", "Are you fasted?", "What have you had today?"], "answer": [{"when": "phase is presentation", "value": "'Bit of toast... seven this morning.'"}, {"when": null, "value": "'A bit of toast about seven this morning, and a cup of tea. I couldn't manage much more than that.'"}]}, {"topic": "sleep_apnea_and_snoring", "canonical": "Do you snore or stop breathing in your sleep?", "variants": ["Has anyone said you snore?", "Do you stop breathing at night?", "Any sleep apnoea?", "Do you use a CPAP machine at night?", "Does your partner mention your breathing at night?", "Are you tired during the day?", "Have you been assessed for sleep apnoea?", "Do you snore heavily?", "Any breathing pauses when asleep?", "Were you offered a mask for sleeping?"], "answer": [{"when": "phase is presentation", "value": "'Wife says I snore... stop breathing.'"}, {"when": null, "value": "'My wife says I snore something awful and that I stop breathing in the night. They offered me one of those masks to sleep in a couple of years back but I couldn't get on with it, so I never used it.'"}]}, {"topic": "recent_illness_or_sick_contacts", "canonical": "Have you been unwell recently or around anyone sick?", "variants": ["Any recent infections?", "Has anyone at home been ill?", "Have you had a cold?", "Any sick contacts?", "Have you had flu symptoms?", "Any sore throat or runny nose?", "Have you been unwell in other ways?", "Any recent illness?", "Has anyone in the family been poorly?", "Have you had a chest infection?"], "answer": [{"when": "phase is presentation", "value": "'No... nobody's been ill.'"}, {"when": null, "value": "'No, nobody's been ill. I've not had a cold or a sore throat or anything like that.'"}], "pertinent_negative": true}, {"topic": "functional_baseline", "canonical": "What could you normally do before this started?", "variants": ["How far can you usually walk?", "What's your normal exercise tolerance?", "Could you manage stairs before this?", "What were you able to do last week?", "How active are you normally?", "Has your walking distance changed?", "What's your baseline function?", "Could you do the shopping before?", "How much can you usually do?", "Were you breathless before this week?"], "answer": [{"when": "phase is presentation", "value": "'Normally manage the stairs... not this week.'"}, {"when": null, "value": "'Normally I can get round the shops and do the stairs at home, though I'd be puffing by the top. If I'm honest I've been slowing down these last few months. This week I couldn't do the stairs at all.'"}]}]}, "handoff": {"correct_disposition": {"id": "icu_or_ccu", "label": "Intensive care unit or coronary care unit", "level_of_care": "critical_care", "explanation": "He is on non-invasive ventilation with a titrating vasoactive infusion. That combination requires a unit that can continue both and reassess frequently, which in most institutions means intensive care or a coronary care unit. If he was intubated during the case, the answer is unambiguously intensive care."}, "alternative_dispositions": [{"id": "stepdown_telemetry", "label": "Step-down or high dependency unit with telemetry", "verdict": "acceptable_with_qualification", "explanation": "Defensible, and at many institutions this is where this patient actually goes. Whether it is correct depends entirely on local capability: a step-down unit that can maintain non-invasive ventilation and titrate a nitrate infusion with frequent blood pressure measurement is an appropriate destination, and one that cannot is not. The reasoning matters more than the label, and a learner who chose this and can articulate what the unit needs to be able to do has understood the question. If the patient was intubated, this becomes wrong."}, {"id": "medical_floor_telemetry", "label": "General medical ward with telemetry", "verdict": "incorrect", "explanation": "A general ward cannot run non-invasive ventilation or a titrating vasodilator, and the nursing ratio does not support the frequency of reassessment this patient needs in the next few hours. The judgement error is treating clinical improvement as though it were resolution. He looks much better than he did on arrival, which is exactly what makes this the tempting wrong answer: he is better because of two interventions that a general ward cannot continue."}, {"id": "observation_unit", "label": "Emergency department observation unit", "verdict": "incorrect", "explanation": "Observation pathways for heart failure exist and are appropriate for a specific, narrow group: mild congestion, no hypoxaemia, no ventilatory support, prompt symptom response to a single diuretic dose, normal or near-baseline renal function, no troponin elevation, and no high-risk features. This patient fails almost every one of those criteria. He required positive pressure ventilation and a vasoactive infusion, his creatinine has moved from baseline, and his troponin is elevated."}, {"id": "discharge_home", "label": "Discharge home with adjusted diuretic and cardiology follow-up", "verdict": "incorrect", "explanation": "Unsafe. He presented in respiratory failure requiring ventilatory support, and the fact that he improved rapidly does not undo that. The precipitant is fixable and the temptation is to think that restarting the diuretic solves it, but he is still several kilograms above his dry weight, still congested, has a rise in creatinine, and has a raised troponin. Early mortality after an admission for decompensated heart failure is substantial, and this is not a presentation that gets sent home from the department."}, {"id": "cardiac_catheterization_lab", "label": "Direct to the cardiac catheterisation laboratory", "verdict": "incorrect", "explanation": "Selecting this almost always means the raised troponin was read as an acute coronary occlusion. The ECG shows an established anterior infarct pattern with no acute ST elevation, no new depression and no reciprocal change, and the troponin elevation is a demand pattern in a decompensated ventricle. Acute coronary syndrome remains a common precipitant of decompensation and deserves inpatient consideration, but nothing here justifies emergent revascularisation."}], "correct_diagnosis": {"catalog_id": "dx_acute_decompensated_heart_failure_with_reduced_ejection_fraction", "label": "Acute decompensated heart failure with reduced ejection fraction, with cardiogenic pulmonary oedema", "explanation": "Acute on chronic decompensation of known HFrEF, presenting as hypertensive acute cardiogenic pulmonary oedema, precipitated by loop diuretic non-adherence and a dietary sodium load. Warm and wet, Nohria profile B.", "label_note": "Label retained for the review packet. The interface shows the diagnosis catalog's own display name, which is shorter."}, "alternative_diagnoses": [{"catalog_id": "dx_copd_exacerbation", "label": "Chronic obstructive pulmonary disease exacerbation", "explanation": "The wheeze invites this and the smoking history supports it, which is why it is the commonest wrong answer to this presentation. What argues against it: no diagnosis of obstructive lung disease, no chronic productive cough, orthopnoea and paroxysmal nocturnal dyspnoea, a raised jugular venous pressure, an S3, symmetrical peripheral oedema, nine pounds of weight gain, and a chest film showing interstitial oedema with effusions rather than hyperinflation. Wheeze in this patient is peribronchial oedema, not bronchospasm. The two conditions coexist often enough that this needs active exclusion rather than assumption."}, {"catalog_id": "dx_community_acquired_pneumonia", "label": "Community-acquired pneumonia", "explanation": "Reasonable to consider in an older patient with dyspnoea and crackles, and excluded by the data available. He is afebrile, his white count is normal, there are no sick contacts and no preceding coryzal illness, and the radiograph shows a symmetrical interstitial pattern with effusions rather than focal consolidation. The lactate of 2.1 is the finding most likely to mislead, and it is explained by respiratory muscle work. Infection is a frequent precipitant of decompensation, so the correct posture is to look for it and then let the evidence settle it."}, {"catalog_id": "dx_pulmonary_embolism", "label": "Acute pulmonary embolism", "explanation": "Usually selected downstream of an unindicated D-dimer. The pretest probability is low: symptoms progressed over days rather than abruptly, there is no pleuritic pain, no haemoptysis, no immobility or travel or surgery, and the leg swelling is symmetrical without calf tenderness. Positive findings point elsewhere, particularly orthopnoea, paroxysmal nocturnal dyspnoea, a raised venous pressure and an S3. Submassive pulmonary embolism can certainly present as breathlessness in a cardiac patient, but it does not usually come with nine pounds of weight gain and a story of a missed diuretic."}, {"catalog_id": "dx_non_st_elevation_myocardial_infarction", "label": "Non-ST-elevation myocardial infarction", "explanation": "The troponin is elevated, so this is not an unreasonable thought, but it confuses myocardial injury with myocardial infarction. Type 2 injury from demand ischaemia is expected in a decompensated ventricle with tachycardia, hypertension and hypertrophy, and almost all such patients have a detectable high-sensitivity troponin. Acute coronary syndrome requires an ischaemic story or ischaemic ECG change alongside a rising and falling pattern. He denies chest pain, is explicit that this feels nothing like his previous infarct, and his ECG shows an unchanged old anterior infarct. It stays on the inpatient differential; it is not the leading diagnosis."}, {"catalog_id": "dx_asthma_exacerbation", "label": "Asthma exacerbation", "explanation": "Follows the same error as the obstructive lung disease answer and is less defensible in a 65 year old with no history of asthma. New wheeze at this age in a patient with known cardiomyopathy is cardiac until proven otherwise."}, {"catalog_id": "dx_acute_respiratory_distress_syndrome", "label": "Acute respiratory distress syndrome", "explanation": "Bilateral infiltrates with hypoxaemia meet part of the definition, but ARDS requires that the respiratory failure is not fully explained by cardiac failure or fluid overload, and here it is entirely explained by exactly that. There is also no ARDS precipitant: no sepsis, aspiration, pancreatitis, trauma or transfusion. The raised jugular venous pressure, S3, plethoric inferior vena cava and severely impaired left ventricle all point to a cardiogenic mechanism."}, {"catalog_id": "dx_sepsis", "label": "Sepsis of unclear source", "explanation": "Selecting this usually means the lactate of 2.1 was read as evidence of shock. He is afebrile with a normal white count, warm and hypertensive with brisk capillary refill and clear mentation, and has no identified source. Hyperlactataemia from work of breathing is a genuine and common phenomenon. The clinical cost of this answer is not academic: it is the fluid bolus that follows it."}], "diagnosis_entry_method": "Search against the global diagnosis catalog. The alternatives
