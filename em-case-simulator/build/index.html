ase. It is entered only by intubating, since no time-driven deterioration exists in this engine. It is recoverable, not terminal."}, "phases": [{"id": "presentation", "label": "Hypertensive acute cardiogenic pulmonary oedema", "clinical_description": "Severe respiratory distress with hypoxaemia and marked hypertension; warm, well-perfused, congested. Nohria profile B.", "vitals": {"heart_rate": 118, "systolic_bp": 188, "diastolic_bp": 104, "respiratory_rate": 32, "oxygen_saturation": 87, "temperature_c": 36.8}, "appearance": {"distress_level": 3, "alertness_level": 0, "pupil_size": "normal", "pupil_reactivity": "reactive"}, "terminal": false, "transitions": [{"when": "flag intubated set", "to": "post_intubation_hypotension", "author_note": "Intubation in a preload-dependent, vasodilated patient predictably drops the blood pressure. Modelled as certain here for teaching; see review packet, this is the most debatable transition in the case."}, {"when": "flag on_niv set AND (flag nitro_infusion_running set OR flag nitro_sl_given set)", "to": "stabilizing", "author_note": "Sublingual nitrate is accepted as a bridge so a learner who has not yet started an infusion is not stranded. The infusion remains the scored critical action."}, {"when": "action handoff_submit taken", "to": "case_complete"}], "short_label": "on arrival"}, {"id": "stabilizing", "label": "Responding to positive pressure and vasodilation", "clinical_description": "Work of breathing and oxygenation improving on non-invasive ventilation with afterload reduction; still congested and not yet diuresed.", "vitals": {"heart_rate": 104, "systolic_bp": 156, "diastolic_bp": 90, "respiratory_rate": 26, "oxygen_saturation": 93, "temperature_c": 36.8}, "appearance": {"distress_level": 2, "alertness_level": 0, "pupil_size": "normal", "pupil_reactivity": "reactive"}, "terminal": false, "transitions": [{"when": "flag intubated set", "to": "post_intubation_hypotension"}, {"when": "flag diuretic_given set", "to": "improving"}, {"when": "action handoff_submit taken", "to": "case_complete"}], "short_label": "responding"}, {"id": "improving", "label": "Decongesting, ready for admission", "clinical_description": "Comfortable on non-invasive ventilation, pressure controlled, diuresis under way. Still requires monitored admission; peripheral oedema and elevated venous pressure persist.", "vitals": {"heart_rate": 92, "systolic_bp": 138, "diastolic_bp": 84, "respiratory_rate": 18, "oxygen_saturation": 96, "temperature_c": 36.8}, "appearance": {"distress_level": 1, "alertness_level": 0, "pupil_size": "normal", "pupil_reactivity": "reactive"}, "terminal": false, "transitions": [{"when": "flag intubated set", "to": "post_intubation_hypotension"}, {"when": "action handoff_submit taken", "to": "case_complete"}], "short_label": "improving"}, {"id": "post_intubation_hypotension", "label": "Post-intubation haemodynamic collapse", "clinical_description": "Loss of endogenous sympathetic drive from induction, positive intrathoracic pressure reducing venous return, and ongoing nitrate vasodilation have produced profound hypotension. Now cold and wet.", "vitals": {"heart_rate": 128, "systolic_bp": 74, "diastolic_bp": 46, "respiratory_rate": 18, "oxygen_saturation": 91, "temperature_c": 36.6}, "appearance": {"distress_level": 1, "alertness_level": 3, "pupil_size": "normal", "pupil_reactivity": "sluggish"}, "terminal": false, "transitions": [{"when": "flag nitro_stopped set AND flag pressor_running set", "to": "intubated_stabilized"}, {"when": "action handoff_submit taken", "to": "case_complete"}], "short_label": "hypotensive after intubation"}, {"id": "intubated_stabilized", "label": "Intubated, haemodynamically supported", "clinical_description": "Perfusing pressure restored on vasopressor with the nitrate stopped. Ventilated and sedated, requiring intensive care.", "vitals": {"heart_rate": 96, "systolic_bp": 108, "diastolic_bp": 68, "respiratory_rate": 16, "oxygen_saturation": 96, "temperature_c": 36.6}, "appearance": {"distress_level": 0, "alertness_level": 3, "pupil_size": "normal", "pupil_reactivity": "sluggish"}, "terminal": false, "transitions": [{"when": "action handoff_submit taken", "to": "case_complete"}], "short_label": "intubated, on a pressor"}, {"id": "halted", "label": "Case halted after a harmful action", "clinical_description": "Terminal phase entered directly when a harmful action is taken, carrying that action's halt reason. Not reached through transition rules.", "vitals": {"heart_rate": 34, "systolic_bp": 48, "diastolic_bp": 28, "respiratory_rate": 6, "oxygen_saturation": 74, "temperature_c": 36.5}, "appearance": {"distress_level": 0, "alertness_level": 3, "pupil_size": "large", "pupil_reactivity": "sluggish"}, "terminal": true, "transitions": [], "schema_gap_note": "The schema provides one vitals block per phase, but the five harmful actions in this case produce different physiology. These are generic peri-arrest values. Per-halt-reason vitals would need a schema change; flagged in the review packet.", "short_label": "stopped"}, {"id": "case_complete", "label": "Handoff confirmed", "clinical_description": "Terminal phase entered when the resident confirms a handoff. The debrief is generated from here.", "vitals": {"heart_rate": 92, "systolic_bp": 138, "diastolic_bp": 84, "respiratory_rate": 18, "oxygen_saturation": 96, "temperature_c": 36.8}, "appearance": {"distress_level": 1, "alertness_level": 0, "pupil_size": "normal", "pupil_reactivity": "reactive"}, "terminal": true, "transitions": [], "schema_gap_note": "Vitals here are a placeholder. The completion phase should inherit the vitals of the phase the resident handed off from; the current schema cannot express that.", "short_label": "handed over"}], "tag_vocabulary": {"values": ["critical", "recommended", "discouraged", "harmful", "neutral"], "values_used_by_this_case": ["critical", "recommended", "harmful", "neutral"], "note": "Enumerated in section 7.3 of case-authoring-requirements v0.3 and scored in section 11.2 of system-design v0.4. The 'discouraged' tier was added in response to this case: seven traps here are wrong but not lethal and could previously only be tagged neutral, which carries no scoring weight. This case has not yet been retagged; see authored_against.conformance_note."}, "flag_namespace_note": "Flags here use unprefixed catalog-level names because catalog prerequisites (for example intubation requiring sedation_given and paralytic_given) must reference the same flag across all cases. Section 14.1 requires that no flag name collide with another case, which is incompatible with shared catalog flags. Flagged in the review packet.", "case_actions": [{"catalog_id": "niv_cpap", "display_name": "Positive pressure ventilation (CPAP/BIPAP)", "tag": [{"when": "phase is post_intubation_hypotension OR phase is intubated_stabilized", "value": "neutral"}, {"when": "phase is presentation", "value": "critical"}, {"when": null, "value": "recommended"}], "flags_set": ["on_niv"], "prerequisites": [{"when": "NOT flag intubated set", "failure_message": "He's already got a tube in and he's on the ventilator. The mask won't do anything now.", "source": "case"}], "prompt": {"deadline_seconds": 45, "guard": "NOT flag intubated set", "text": "He's working really hard to breathe and his sat is sitting at 87 on six litres. Do you want to do something more for his breathing? I can get the CPAP mask on him.", "escalation": {"deadline_seconds": 90, "text": "He's still tripoding and pulling with his neck muscles, sat's still 87. I've got CPAP and BiPAP both at the bedside. Do you want either of them on him?"}}, "debrief_note": "Non-invasive positive pressure ventilation is the single highest-value early intervention in acute cardiogenic pulmonary oedema. It recruits flooded alveoli, reduces the work of breathing, and by raising intrathoracic pressure it reduces both preload and left ventricular transmural pressure, which lowers afterload. Applying it early is what allows most of these patients to avoid an endotracheal tube. Be honest with learners about the evidence: earlier meta-analyses reported reductions in intubation and mortality, but the largest randomised trial, 3CPO, found no difference in seven-day mortality or intubation rate versus standard oxygen therapy. The strongest defensible claim is faster symptomatic and physiological improvement, with intubation avoidance supported by meta-analytic but not by the single largest trial.", "references": ["Gray A, Goodacre S, Newby DE, Masson M, Sampson F, Nicholl J; 3CPO Trialists. Noninvasive ventilation in acute cardiogenic pulmonary edema. N Engl J Med. 2008;359(2):142-51. [PubMed record checked]", "Masip J, Roque M, Sanchez B, et al. Noninvasive ventilation in acute cardiogenic pulmonary edema: systematic review and meta-analysis. JAMA. 2005;294(24):3124-30. [citation seen in secondary sources; verify]"]}, {"catalog_id": "niv_bipap", "display_name": "BiPAP, IPAP 12 / EPAP 6, FiO2 titrated", "tag": [{"when": "phase is post_intubation_hypotension OR phase is intubated_stabilized", "value": "neutral"}, {"when": "phase is presentation", "value": "critical"}, {"when": null, "value": "recommended"}], "flags_set": ["on_niv"], "prerequisites": [{"when": "NOT flag intubated set", "failure_message": "He's already got a tube in and he's on the ventilator. The mask won't do anything now.", "source": "case"}], "debrief_note": "Equivalent to CPAP for the purposes of this case. Bilevel adds inspiratory support, which is often preferred when the patient is hypercapnic and tiring, as this one is with a pCO2 of 54. 3CPO found no difference between CPAP and bilevel in mortality or intubation rate, so either is a defensible choice and the important decision was to apply positive pressure at all. Historical concern that bilevel increased myocardial infarction has not been borne out.", "references": ["Gray A, et al. N Engl J Med. 2008;359(2):142-51. [PubMed record checked]"]}, {"catalog_id": "nitroglycerin_infusion", "display_name": "Nitroglycerin infusion, start 50 to 100 mcg/min, titrate", "tag": [{"when": "phase is post_intubation_hypotension OR phase is intubated_stabilized", "value": "harmful"}, {"when": "phase is presentation", "value": "critical"}, {"when": "phase is stabilizing", "value": "recommended"}, {"when": null, "value": "recommended"}], "flags_set": ["nitro_infusion_running"], "prerequisites": [{"when": "flag iv_access set", "failure_message": "He hasn't got a line in yet. I need IV access before I can run an infusion.", "source": "catalog_default_retained"}], "follow_ups_triggered": ["bp_cycling_after_nitrate"], "prompt": {"deadline_seconds": 75, "guard": "NOT flag intubated set", "text": "His pressure is 188 over 104. Do you want anything for the blood pressure while we're sorting out his breathing?"}, "halt_reason": "You started a nitroglycerin infusion in a patient whose blood pressure was already dependent on vasopressor support after intubation; the additional preload and afterload reduction collapsed his coronary perfusion pressure and he arrested.", "debrief_note": "Afterload reduction is the pharmacological priority in hypertensive acute cardiogenic pulmonary oedema. This patient is not primarily short of diuresis in the first ten minutes; he is short of forward flow against a systolic pressure of 188 with a failing ventricle, and a large part of his pulmonary oedema is redistribution rather than accumulated total body water. Nitrates reduce preload at lower doses and afterload at higher ones, and the trial evidence supports a vasodilator-forward rather than diuretic-forward strategy in this specific phenotype. Doses used for this indication are considerably higher than the anti-anginal doses residents are used to. The same drug becomes harmful the moment the patient is hypotensive, which is why the tag on this action is phase-dependent rather than fixed.", "references": ["Cotter G, Metzkor E, Kaluski E, et al. Randomised trial of high-dose isosorbide dinitrate plus low-dose furosemide versus high-dose furosemide plus low-dose isosorbide dinitrate in severe pulmonary oedema. Lancet. 1998;351(9100):389-93. [PubMed record checked]", "Heidenreich PA, et al. 2022 AHA/ACC/HFSA Guideline for the Management of Heart Failure. Circulation. 2022;145(18):e895-e1032. [UNVERIFIED, confirm before release]"]}, {"catalog_id": "nitroglycerin_sublingual", "display_name": "Nitroglycerin 0.4 mg sublingual", "tag": [{"when": "phase is post_intubation_hypotension OR phase is intubated_stabilized", "value": "harmful"}, {"when": null, "value": "recommended"}], "flags_set": ["nitro_sl_given"], "halt_reason": "You gave sublingual nitroglycerin to a patient whose blood pressure was already dependent on vasopressor support after intubation; further vasodilation dropped his coronary perfusion pressure and he arrested.", "debrief_note": "A reasonable bridge while an infusion is being mixed, and repeated sublingual dosing is a legitimate strategy when a pump is not immediately available. It is not a substitute for a titratable infusion in a patient who is going to need sustained afterload reduction, because the effect is short-lived and cannot be dialled back if the pressure falls too far. Credit here is partial: the right idea, an incomplete execution."}, {"catalog_id": "nitroglycerin_stop", "display_name": "Stop the nitroglycerin infusion", "tag": [{"when": "phase is post_intubation_hypotension", "value": "critical"}, {"when": "phase is presentation", "value": "neutral"}, {"when": null, "value": "neutral"}], "flags_set": ["nitro_stopped"], "prerequisites": [{"when": "flag nitro_infusion_running set", "failure_message": "There's no nitro running at the moment, so there's nothing for me to stop.", "source": "case"}], "prompt": {"deadline_seconds": 25, "text": "His pressure is 74 over 46 and the nitro is still running at the rate you set. Do you want me to do something about that?"}, "debrief_note": "Stopping the vasodilator is the first move in post-intubation hypotension in a patient on a nitrate infusion, and it is free. It is easy to reach for a pressor while the drug driving the hypotension continues to run. Turning the infusion off does not act instantly, which is why it is done alongside, not instead of, haemodynamic support."}, {"catalog_id": "furosemide_iv", "display_name": "Furosemide 40 mg IV", "tag": [{"when": "phase is post_intubation_hypotension OR phase is intubated_stabilized", "value": "neutral"}, {"when": "phase is stabilizing", "value": "critical"}, {"when": "phase is presentation", "value": "recommended"}, {"when": null, "value": "recommended"}], "flags_set": ["diuretic_given"], "prerequisites": [{"when": "flag iv_access set", "failure_message": "No line in yet. I need IV access before I can give that.", "source": "catalog_default_retained"}], "follow_ups_triggered": ["urine_output_after_diuretic"], "prompt": {"deadline_seconds": 60, "text": "He's breathing easier on the mask now. He told the medics he's been out of his water pill for the best part of a week. Do you want to give him a diuretic?"}, "debrief_note": "This patient genuinely is volume overloaded, not only redistributed: four kilograms above his stated dry weight, five days without his loop diuretic, peripheral oedema and a raised venous pressure. He needs diuresis. The teaching point is sequencing, not omission. Positive pressure and vasodilation act within minutes on the process that is threatening him now; the diuretic acts on the total body sodium and water that accumulated over days. Dose matters: a patient already on a loop diuretic at home requires more than a naive dose, and the conventional approach is to give at least two to two and a half times the home oral dose intravenously. The DOSE trial found no significant difference in its co-primary endpoints between high and low dose or between bolus and infusion, with the high-dose strategy showing better symptom relief on secondary measures at the cost of transient rises in creatinine, so present dosing as a reasoned choice rather than a rule.", "references": ["Felker GM, Lee KL, Bull DA, et al. Diuretic strategies in patients with acute decompensated heart failure. N Engl J Med. 2011;364(9):797-805. [PubMed record checked]", "Cotter G, et al. Lancet. 1998;351(9100):389-93. [PubMed record checked]"]}, {"catalog_id": "iv_access_peripheral", "display_name": "Insert IV", "tag": [{"when": null, "value": "recommended"}], "flags_set": ["iv_access"], "debrief_note": "Unglamorous and rate-limiting. Every intravenous drug in this case is gated behind it, which is the point: the resident who orders a nitroglycerin infusion before anyone has a line has ordered something that cannot happen yet."}, {"catalog_id": "cardiac_monitor", "display_name": "Continuous cardiac monitoring and pulse oximetry", "tag": [{"when": null, "value": "recommended"}], "flags_set": ["on_monitor"], "debrief_note": "Standard for any patient with acute dyspnoea and known cardiomyopathy. In this case the rhythm is sinus tachycardia throughout, but atrial fibrillation with rapid ventricular response is one of the commonest precipitants of decompensation and would change management substantially, so it is worth confirming rather than assuming."}, {"catalog_id": "oxygen_nonrebreather", "display_name": "Non-rebreather mask at 15 L/min", "tag": [{"when": null, "value": "recommended"}], "flags_set": ["oxygen_nrb"], "debrief_note": "A reasonable bridge while non-invasive ventilation is set up, and better than leaving him on the cannula. It does not do the thing this patient needs most, which is positive airway pressure. Note also that oxygen is a treatment for hypoxaemia, not for dyspnoea; a non-hypoxaemic breathless heart failure patient does not benefit from high-flow oxygen and there is reason to think hyperoxia is unhelpful in cardiac patients."}, {"catalog_id": "ecg_12_lead", "display_name": "Twelve-lead ECG", "tag": [{"when": "phase is presentation", "value": "critical"}, {"when": null, "value": "recommended"}], "flags_set": [], "prompt": {"deadline_seconds": 90, "text": "Do you want a twelve lead on him? I can have it done in a minute."}, "debrief_note": "Mandatory, and for two reasons rather than one. The first is to look for an acute coronary occlusion driving the decompensation, which would redirect the entire case toward the catheter laboratory. The second is to identify a tachyarrhythmia, since new atrial fibrillation is among the most common precipitants of acute decompensation in a patient with a fixed low ejection fraction. Here the ECG is neither: sinus tachycardia with left ventricular hypertrophy and the old anterior infarct pattern. Recognising an unchanged old infarct pattern as old is itself a skill worth practising."}, {"catalog_id": "cxr_portable", "display_name": "Portable chest radiograph", "tag": [{"when": "phase is presentation", "value": "critical"}, {"when": null, "value": "recommended"}], "flags_set": [], "prompt": {"deadline_seconds": 150, "text": "Do you want a portable chest film? Radiography is free at the moment."}, "debrief_note": "Supports the diagnosis and, more usefully, excludes the alternatives that would change management: pneumothorax, lobar consolidation, a large effusion. Be careful how much weight learners put on it. A meaningful minority of patients with acute decompensated heart failure have a chest film that is not obviously congested, particularly early and particularly in chronically remodelled lungs, so a normal-looking film does not exclude the diagnosis. Note the result freezing behaviour in this engine: a film ordered before intubation shows no endotracheal tube even if it arrives afterwards.", "references": ["Wang CS, FitzGerald JM, Schulzer M, Mak E, Ayas NT. Does this dyspneic patient in the emergency department have congestive heart failure? JAMA. 2005;294(15):1944-56. [UNVERIFIED, confirm before release]"]}, {"catalog_id": "pocus_lung_cardiac", "display_name": "Bedside lung and cardiac ultrasound", "tag": [{"when": null, "value": "recommended"}], "flags_set": [], "turnaround_override_seconds": 3, "turnaround_override_rationale": "Section 8.1 of the system design permits per-study overrides but expects them unused. Bedside ultrasound is performed by the treating clinician and returns in real time; the imaging class of 10 seconds would misrepresent it. Flagged as a request for a 'bedside' turnaround class in the catalog rather than a per-case override.", "debrief_note": "The fastest way to separate cardiogenic from non-cardiogenic dyspnoea at the bedside. Diffuse bilateral B-lines with a plethoric inferior vena cava and a visibly poor left ventricle is close to diagnostic in this context, and the whole study takes under two minutes. It also answers the question the physical examination cannot: whether this patient is warm and wet or cold and wet, which determines whether he gets vasodilated or supported.", "references": ["Lichtenstein DA, Meziere GA. Relevance of lung ultrasound in the diagnosis of acute respiratory failure: the BLUE protocol. Chest. 2008;134(1):117-25. [UNVERIFIED, confirm before release]"]}, {"catalog_id": "interview_topic_medication_adherence", "display_name": "Ask about medication adherence", "schema_note": "Represented as a case action so that transitions, tags and scoring can reference it. Neither source document states whether interview topics carry action ids addressable by the 'action A taken' predicate. Flagged in the review packet.", "tag": [{"when": null, "value": "critical"}], "flags_set": [], "prompt": {"deadline_seconds": 210, "text": "Did you want to ask him about his tablets? He said something to the medics about running out."}, "debrief_note": "Finding the precipitant is part of the resuscitation, not paperwork for the admitting team. Decompensation in a patient with stable chronic heart failure almost always has a reason: missed diuretic, dietary sodium, new atrial fibrillation, ischaemia, infection, anaemia, thyroid disease, or a newly started negative inotrope or NSAID. Here it is a loop diuretic he stopped taking five days ago plus a salt load. That answer changes the admission plan, changes the discharge plan, and is the modifiable part of this presentation. A resident who stabilises the physiology but never asks why it happened has treated the episode and not the patient."}, {"catalog_id": "intubation_rsi", "display_name": "Rapid sequence intubation", "tag": [{"when": "phase is post_intubation_hypotension OR phase is intubated_stabilized", "value": "neutral"}, {"when": null, "value": "neutral"}], "flags_set": ["intubated"], "prerequisites": [{"when": "flag sedation_given set", "failure_message": "He isn't sedated. We need an induction agent before we tube him.", "source": "catalog_default_retained"}, {"when": "flag paralytic_given set", "failure_message": "He hasn't had a paralytic. We need that before we tube him.", "source": "catalog_default_retained"}], "follow_ups_triggered": ["post_intubation_sedation", "post_intubation_cxr"], "debrief_note": "Not a harmful action, and not a scored error, but in this case it was avoidable and it cost the patient. Most patients with acute cardiogenic pulmonary oedema who receive early positive pressure do not need a tube. This patient was hypercapnic and tiring, which frightens people into intubating, but hypercapnia in acute pulmonary oedema is usually a fatigue phenomenon that corrects with non-invasive support rather than an independent indication for a tube. When intubation is genuinely required, anticipate the collapse rather than react to it: this patient is preload-dependent, vasodilated on a nitrate infusion, and about to receive both an induction agent that removes his sympathetic drive and positive intrathoracic pressure that reduces venous return. Have a vasopressor drawn up before you push the drugs. Post-intubation hypotension is common in emergency airway management and predicts poor outcome.", "references": ["Heffner AC, Swords DS, Nussbaum ML, Kline JA, Jones AE. Predictors of the complication of postintubation hypotension during emergency airway management. J Crit Care. 2012;27(6):587-93. [UNVERIFIED, confirm before release]", "Gray A, et al. N Engl J Med. 2008;359(2):142-51. [PubMed record checked]"]}, {"catalog_id": "etomidate_iv", "display_name": "Etomidate 0.3 mg/kg IV", "tag": [{"when": null, "value": "neutral"}], "flags_set": ["sedation_given"], "prerequisites": [{"when": "flag iv_access set", "failure_message": "No line in yet. I need IV access before I can give that.", "source": "catalog_default_retained"}], "debrief_note": "A reasonable induction agent in a patient with marginal haemodynamics, chosen because it is relatively cardiostable compared with propofol. It is not haemodynamically neutral in a patient this preload-dependent, and it will still contribute to post-intubation hypotension by removing endogenous catecholamine drive."}, {"catalog_id": "ketamine_iv", "display_name": "Ketamine 1 to 2 mg/kg IV", "tag": [{"when": null, "value": "neutral"}], "flags_set": ["sedation_given"], "prerequisites": [{"when": "flag iv_access set", "failure_message": "No line in yet. I need IV access before I can give that.", "source": "catalog_default_retained"}], "debrief_note": "A defensible induction agent here. Its indirect sympathomimetic effect is often protective in shock states, though that depends on endogenous catecholamine reserve that a patient in extremis may have already exhausted, and it is a direct myocardial depressant when that reserve is gone. In this patient, who is hypertensive and tachycardic before induction, the reserve is intact."}, {"catalog_id": "rocuronium_iv", "display_name": "Rocuronium 1.2 mg/kg IV", "tag": [{"when": null, "value": "neutral"}], "flags_set": ["paralytic_given"], "prerequisites": [{"when": "flag iv_access set", "failure_message": "No line in yet. I need IV access before I can give that.", "source": "catalog_default_retained"}], "debrief_note": "An appropriate paralytic. Its long duration means a patient who is paralysed but under-sedated stays that way for a long time, which is why post-intubation sedation is enforced as a follow-up requirement in this case."}, {"catalog_id": "succinylcholine_iv", "display_name": "Succinylcholine 1.5 mg/kg IV", "tag": [{"when": null, "value": "neutral"}], "flags_set": ["paralytic_given"], "prerequisites": [{"when": "flag iv_access set", "failure_message": "No line in yet. I need IV access before I can give that.", "source": "catalog_default_retained"}], "debrief_note": "Acceptable here. His potassium is normal and he has no burn, crush injury, or chronic denervation, so the hyperkalaemia contraindications do not apply. Note that he does have chronic kidney disease; renal impairment alone is not a contraindication to succinylcholine, but a pre-existing hyperkalaemia would be, and in this case the potassium is known before intubation only if someone sent a chemistry panel."}, {"catalog_id": "post_intubation_sedation_infusion", "display_name": "Post-intubation analgesia and sedation infusion", "tag": [{"when": "phase is post_intubation_hypotension OR phase is intubated_stabilized", "value": "critical"}, {"when": null, "value": "neutral"}], "flags_set": ["post_intubation_sedation"], "prerequisites": [{"when": "flag intubated set", "failure_message": "He isn't intubated, so there's no tube to sedate him for.", "source": "case"}], "debrief_note": "A paralysed, unsedated patient is awake and unable to move or signal. This is the canonical follow-up requirement rather than a prerequisite, precisely because it cannot be satisfied before the intubation it follows. Choose the agent with the blood pressure in mind: a propofol infusion in a patient who is already hypotensive will make it worse, and an analgesia-first approach with fentanyl, or ketamine, is usually kinder to the haemodynamics."}, {"catalog_id": "vent_settings_lung_protective", "display_name": "Set lung-protective ventilator settings", "tag": [{"when": "phase is post_intubation_hypotension OR phase is intubated_stabilized", "value": "recommended"}, {"when": null, "value": "neutral"}], "flags_set": ["vent_settings_set"], "prerequisites": [{"when": "flag intubated set", "failure_message": "He isn't on the ventilator yet.", "source": "case"}], "debrief_note": "Six to eight millilitres per kilogram of predicted body weight, calculated from height rather than actual weight. In this patient, positive end-expiratory pressure is doing useful work against the pulmonary oedema, so it should not be abandoned wholesale when the pressure falls; it is one contributor among several and reducing it is a lever, not the first move."}, {"catalog_id": "peep_reduce", "display_name": "Reduce PEEP", "tag": [{"when": "phase is post_intubation_hypotension", "value": "recommended"}, {"when": null, "value": "neutral"}], "flags_set": ["peep_reduced"], "prerequisites": [{"when": "flag intubated set", "failure_message": "He isn't on the ventilator, so there's no PEEP to change.", "source": "case"}], "debrief_note": "A legitimate lever in post-intubation hypotension, since high intrathoracic pressure reduces venous return. It is a trade in this patient: the same positive pressure is treating his pulmonary oedema. Reduce it thoughtfully and watch the saturation, rather than dropping it to zero reflexively."}, {"catalog_id": "norepinephrine_infusion", "display_name": "Norepinephrine infusion", "tag": [{"when": "phase is post_intubation_hypotension", "value": "critical"}, {"when": "phase is presentation OR phase is stabilizing OR phase is improving", "value": "harmful"}, {"when": null, "value": "neutral"}], "flags_set": ["pressor_running"], "prerequisites": [{"when": "flag iv_access set", "failure_message": "No line in yet. I need access before I can run a pressor.", "source": "catalog_default_retained"}], "prerequisite_overrides": [{"waived": "central_venous_access_required", "source": "catalog_default_waived", "author_rationale": "The catalog default requiring central venous access before a vasopressor is waived in this case. Short-duration peripheral administration through a well-sited proximal cannula with close monitoring is accepted practice and delaying pressure support in post-intubation collapse to place a central line is the greater harm. Extravasation risk from short peripheral vasopressor courses is low in the published series, though those series are observational."}], "prompt": {"deadline_seconds": 40, "text": "Pressure is 74 over 46 since the tube went in. Do you want me to start a pressor? I can run norepinephrine through the big cannula in his elbow."}, "halt_reason": "You started a vasopressor in a patient with a systolic pressure of 188 who was already well perfused; the additional afterload on a failing left ventricle worsened his pulmonary oedema and he arrested.", "debrief_note": "The correct haemodynamic support for this patient once he is hypotensive after intubation. He has become cold and wet: the problem is now perfusion pressure, not congestion. Norepinephrine is generally preferred over epinephrine in cardiogenic shock, where a randomised comparison was stopped early for a higher rate of refractory shock in the epinephrine arm. Giving a vasopressor to the same patient while he is hypertensive is a different action entirely, which is why the tag on this entry is phase-dependent.", "references": ["Levy B, Clere-Jehl R, Legras A, et al. Epinephrine versus norepinephrine for cardiogenic shock after acute myocardial infarction. J Am Coll Cardiol. 2018;72(2):173-82. [UNVERIFIED, confirm before release]", "Cardenas-Garcia J, Schaub KF, Belchikov YG, Narasimhan M, Koenig SJ, Mayo PH. Safety of peripheral intravenous administration of vasoactive medication. J Hosp Med. 2015;10(9):581-5. [UNVERIFIED, confirm before release]"]}, {"catalog_id": "epinephrine_push_dose", "display_name": "Push-dose epinephrine, 10 to 20 mcg", "tag": [{"when": "phase is post_intubation_hypotension", "value": "recommended"}, {"when": "phase is presentation OR phase is stabilizing OR phase is improving", "value": "harmful"}, {"when": null, "value": "neutral"}], "flags_set": ["pressor_running"], "prerequisites": [{"when": "flag iv_access set", "failure_message": "No line in yet.", "source": "catalog_default_retained"}], "halt_reason": "You gave push-dose epinephrine to a patient with a systolic pressure of 188 who was already well perfused; the abrupt rise in afterload and myocardial oxygen demand on a failing ischaemic ventricle precipitated arrest.", "debrief_note": "An acceptable temporising measure while an infusion is prepared, and better than watching a pressure of 74 while the pump is being spiked. It is a bridge, not a plan; boluses of a short-acting catecholamine produce peaks and troughs, and this patient needs a titratable infusion. Dosing errors with push-dose pressors are well described and the preparation step is where they happen."}, {"catalog_id": "metoprolol_iv", "display_name": "Metoprolol 5 mg IV", "tag": [{"when": null, "value": "harmful"}], "flags_set": ["beta_blocker_given"], "prerequisites": [{"when": "flag iv_access set", "failure_message": "No line in yet.", "source": "catalog_default_retained"}], "halt_reason": "You gave intravenous metoprolol to a patient in acute decompensated heart failure whose cardiac output depended on his heart rate and endogenous adrenergic drive; acute beta blockade dropped stroke volume and rate together, and he progressed to cardiogenic shock and arrested.", "debrief_note": "This is the classic trap in this case and the reason the sinus tachycardia is set at 118. The tachycardia is compensatory: it is how a ventricle with an ejection fraction of 25 percent maintains cardiac output. Removing it removes the compensation. Chronic beta blockade improves survival in HFrEF and that is exactly why residents reach for it, but initiating or up-titrating beta blockade during acute decompensation is a different intervention with different physiology, and guidelines advise against it until the patient is compensated. Note the separate question of whether to continue his home carvedilol: in a patient without hypoperfusion, continuing the home dose is usually reasonable, but that is a decision about maintaining a chronic drug, not about pushing five milligrams into a decompensated ventricle.", "references": ["Heidenreich PA, et al. 2022 AHA/ACC/HFSA Guideline for the Management of Heart Failure. Circulation. 2022;145(18):e895-e1032. [UNVERIFIED, confirm before release]"]}, {"catalog_id": "diltiazem_iv", "display_name": "Diltiazem 10 mg IV", "tag": [{"when": null, "value": "harmful"}], "flags_set": ["ccb_given"], "prerequisites": [{"when": "flag iv_access set", "failure_message": "No line in yet.", "source": "catalog_default_retained"}], "halt_reason": "You gave intravenous diltiazem, a negative inotrope, to a patient with an ejection fraction of 25 percent in acute decompensation; contractility fell further, cardiac output collapsed, and he arrested.", "debrief_note": "Non-dihydropyridine calcium channel blockers are negatively inotropic and are contraindicated in decompensated HFrEF. The trap is dressed as rate control for the tachycardia, exactly as intravenous metoprolol is. Two separate errors are bundled here: treating a compensatory sinus tachycardia as though it were an arrhythmia, and choosing an agent that suppresses contractility in a patient with almost none to spare. If this patient were in atrial fibrillation with a rapid ventricular response, diltiazem would still be the wrong drug for the same reason."}, {"catalog_id": "crystalloid_bolus_1l", "tag": [{"when": null, "value": "harmful"}], "flags_set": ["fluid_bolus_given"], "prerequisites": [{"when": "flag iv_access set", "failure_message": "No line in yet.", "source": "catalog_default_retained"}], "halt_reason": "You gave a litre of crystalloid to a patient already several litres fluid overloaded with cardiogenic pulmonary oedema; the added preload raised his pulmonary venous pressure further, his oxygenation failed, and he arrested.", "debrief_note": "The commonest reflex to a tachycardic, unwell-looking patient, and the wrong one here. Every finding in front of you points away from hypovolaemia: raised jugular venous pressure, an S3, bilateral crackles, peripheral oedema, four kilograms above his dry weight, and a systolic pressure of 188. This is worth dwelling on in the debrief because the same reflex is correct in the septic patient two beds over, and the discriminating skill is the volume assessment rather than the general rule. Note that this remains harmful in the post-intubation hypotension phase: the hypotension there is vasodilation and reduced venous return in a fluid-overloaded patient, and the treatment is a vasopressor and stopping the nitrate, not volume.", "binding_note": "Bound to normal_saline_1l_bolus and covers the other three crystalloid boluses. The resident sees four separate agents with catalog names; all four carry this action's harmful tag."}, {"catalog_id": "dobutamine_infusion", "display_name": "Dobutamine infusion", "tag": [{"when": "phase is post_intubation_hypotension", "value": "neutral"}, {"when": "phase is presentation OR phase is stabilizing OR phase is improving", "value": "harmful"}, {"when": null, "value": "neutral"}], "flags_set": ["inotrope_running"], "prerequisites": [{"when": "flag iv_access set", "failure_message": "No line in yet.", "source": "catalog_default_retained"}], "halt_reason": "You started dobutamine in a hypertensive, warm, well-perfused patient with an ischaemic cardiomyopathy; the rise in myocardial oxygen demand and its arrhythmogenic effect precipitated sustained ventricular tachycardia with haemodynamic collapse.", "debrief_note": "Inotropes belong to the cold profile, not the warm one. This patient is congested but perfusing: warm extremities, normal capillary refill, a normal lactate, adequate mental status, and a systolic pressure of 188. There is nothing for an inotrope to fix and a great deal for it to destabilise in a heart with an old anterior infarct. Inotrope exposure in acute decompensated heart failure has been associated with more arrhythmia and hypotension without outcome benefit, and the routine-use trial in patients not requiring inotropic support was negative. This is the most debatable harmful designation in the case: the physiological argument is strong, but calling a single dobutamine order immediately lethal is a modelling choice made for teaching emphasis, and the reviewing physician should decide whether it should instead be a deterioration path.", "references": ["Cuffe MS, Califf RM, Adams KF Jr, et al. Short-term intravenous milrinone for acute exacerbation of chronic heart failure: a randomized controlled trial (OPTIME-CHF). JAMA. 2002;287(12):1541-7. [UNVERIFIED, confirm before release]"]}, {"catalog_id": "morphine_iv", "display_name": "Morphine 4 mg IV", "tag": [{"when": null, "value": "neutral"}], "flags_set": ["morphine_given"], "prerequisites": [{"when": "flag iv_access set", "failure_message": "No line in yet.", "source": "catalog_default_retained"}], "debrief_note": "Morphine was taught for decades as a treatment for acute pulmonary oedema on the reasoning that it reduces preload and relieves the distressing sensation of breathlessness. That rationale has not held up. Observational data, most prominently a large registry analysis, found morphine use independently associated with higher mortality, more mechanical ventilation, more intensive care admission and longer stay; a later propensity-matched registry analysis pointed the same way. The evidence is observational and confounding by indication is a serious limitation, since the sickest and most distressed patients are the ones who get morphine. So the honest summary is not that morphine kills, but that the benefit was never demonstrated, the harm signal is consistent across datasets, and there is a better tool for the same problem: the distress in this patient is caused by hypoxaemia and work of breathing, and non-invasive ventilation treats the cause rather than blunting the perception of it. This action is tagged neutral only because the tag vocabulary has no intermediate value between neutral and case-halting harm.", "references": ["Peacock WF, Hollander JE, Diercks DB, Lopatin M, Fonarow G, Emerman CL. Morphine and outcomes in acute decompensated heart failure: an ADHERE analysis. Emerg Med J. 2008;25(4):205-9. [PubMed record checked]", "Miro O, Gil V, Martin-Sanchez FJ, et al. Morphine use in the emergency department and outcomes of patients with acute heart failure: a propensity score-matching analysis based on the EAHFE Registry. Chest. 2017;152(4):821-32. [citation seen in secondary sources; verify]"]}, {"catalog_id": "albuterol_ipratropium_neb", "display_name": "Albuterol and ipratropium nebuliser", "tag": [{"when": null, "value": "neutral"}], "flags_set": ["bronchodilator_given"], "debrief_note": "This is the cardiac asthma trap and the wheeze on his chest is deliberately there to bait it. Peribronchial oedema narrows small airways and produces expiratory wheeze that sounds exactly like bronchospasm. The distinguishing features are all present: raised jugular venous pressure, an S3, bilateral crackles under the wheeze, peripheral oedema, orthopnoea, and no history of obstructive lung disease. A beta agonist does not treat pulmonary oedema. It does increase heart rate and myocardial oxygen demand in a patient with an ischaemic cardiomyopathy, and it drives potassium intracellularly in a patient about to receive a loop diuretic. When you genuinely cannot tell, treating both is defensible; assuming bronchospasm without examining the neck veins is not."}, {"catalog_id": "methylprednisolone_iv", "display_name": "Methylprednisolone 125 mg IV", "tag": [{"when": null, "value": "neutral"}], "flags_set": ["steroid_given"], "prerequisites": [{"when": "flag iv_access set", "failure_message": "No line in yet.", "source": "catalog_default_retained"}], "debrief_note": "Follows the same misdiagnosis as the nebuliser: an obstructive airways picture that is not there. No benefit in cardiogenic pulmonary oedema, and real cost in a diabetic patient whose glucose is already 172, since a steroid dose will drive it substantially higher and add sodium and water retention to a patient you are trying to decongest."}, {"catalog_id": "ceftriaxone_iv", "display_name": "Ceftriaxone 1 g IV", "tag": [{"when": null, "value": "neutral"}], "flags_set": ["antibiotic_given"], "prerequisites": [{"when": "flag iv_access set", "failure_message": "No line in yet.", "source": "catalog_default_retained"}], "debrief_note": "Reasonable to consider and unsupported once you look. He is afebrile at 36.8, his white count is normal at 8.2, his chest film shows a symmetrical interstitial pattern with effusions rather than consolidation, and the history is days of orthopnoea and weight gain rather than cough and fever. Infection is a common precipitant of decompensation and worth actively excluding, so the thought is right; committing to it here means ignoring the answer the workup already gave you. The mildly raised lactate of 2.1 is a work-of-breathing phenomenon, not evidence of sepsis, and it is the finding most likely to pull a learner down this path."}, {"catalog_id": "aspirin_po", "display_name": "Aspirin 324 mg chewed", "tag": [{"when": null, "value": "neutral"}], "flags_set": ["aspirin_given"], "debrief_note": "Low cost and low harm, and he takes 81 mg daily at home anyway. The reason it appears in the debrief is what it usually signals: a learner who saw a troponin of 62 and started an acute coronary syndrome pathway. The troponin here is a type 2 injury pattern, demand ischaemia from tachycardia and wall stress in a hypertrophied, chronically infarcted ventricle, and it is accompanied by an ECG with no acute ischaemic change. Almost all patients with acute decompensated heart failure have a detectable troponin on a high-sensitivity assay, and a modestly raised value is prognostic rather than diagnostic. The question to ask is not whether the troponin is elevated but whether the pattern, the ECG and the story fit acute coronary occlusion. Here they do not."}, {"catalog_id": "labs_dimer", "display_name": "D-dimer", "tag": [{"when": null, "value": "neutral"}], "flags_set": [], "debrief_note": "Ordered without a pretest probability, and it comes back at 0.94, which is what a D-dimer does in a 65 year old with heart failure. It was never going to be negative and it cannot exclude anything in a patient in whom you have not first established that pulmonary embolism is a plausible diagnosis. Consider what the history already gave you: five days of progressive orthopnoea, paroxysmal nocturnal dyspnoea, weight gain and leg swelling that is symmetrical, no calf asymmetry, no immobility, no malignancy, no recent surgery. The teaching point is test discipline. An unindicated test with a foreseeable abnormal result generates a CT angiogram, a contrast load, and an anchoring error."}, {"catalog_id": "ct_pulmonary_angiogram", "display_name": "CT pulmonary angiogram", "tag": [{"when": null, "value": "neutral"}], "flags_set": [], "debrief_note": "Not indicated, and getting there usually means an unindicated D-dimer came back positive. The concrete costs are the radiation, the cost, and above all removing a patient in respiratory distress on non-invasive ventilation from a resuscitation area to lie flat in a scanner, which is the real hazard here rather than the contrast. On contrast and the kidneys, be careful what you teach: contrast-associated acute kidney injury is a genuine entity, but the risk attributable to contrast has been substantially overstated in older literature that lacked control groups, and more recent propensity-matched work suggests a far smaller effect than was once believed. Withholding a genuinely indicated scan out of renal fear is its own error. The reason not to scan this patient is that he does not need it."}, {"catalog_id": "bp_cycling_q5min", "display_name": "Cycle blood pressure every 5 minutes", "tag": [{"when": null, "value": "recommended"}], "flags_set": ["bp_monitoring_q5"], "debrief_note": "A titratable vasodilator in a patient whose pressure you intend to move substantially requires blood pressure measurement at an interval short enough to catch an overshoot. Cycling every fifteen minutes while running nitroglycerin is how a patient ends up hypotensive between readings."}, {"catalog_id": "urine_output_monitoring", "display_name": "Monitor and document urine output", "tag": [{"when": null, "value": "recommended"}], "flags_set": ["urine_output_monitored"], "debrief_note": "Diuretic response is the measurement that tells you whether your treatment worked, and it is the earliest signal of diuretic resistance. Documented output also matters for the admitting team, who will titrate against it. Note that this does not require a urinary catheter; a bottle and a nurse who records the volume is enough, and avoids the catheter-associated infection risk in an admitted patient."}, {"catalog_id": "foley_catheter", "display_name": "Insert urinary catheter", "tag": [{"when": null, "value": "neutral"}], "flags_set": ["foley_placed", "urine_output_monitored"], "debrief_note": "Defensible in a patient who is about to be heavily diuresed, on non-invasive ventilation, and unable to get to a toilet, and it becomes clearly appropriate if he is intubated. It is not a mandatory part of managing acute heart failure, and reflexive catheterisation of every diuresed patient carries an infection cost. A reasoned choice either way."}, {"catalog_id": "labs_cbc", "display_name": "Full blood count", "tag": [{"when": null, "value": "recommended"}], "flags_set": [], "debrief_note": "Screens for anaemia, which is both a precipitant of decompensation and a marker of worse outcomes in heart failure, and for the leukocytosis that would support an infective trigger. Here the haemoglobin of 12.4 is mildly low and worth noting on the admission problem list, and the normal white count argues against infection."}, {"catalog_id": "labs_bmp", "display_name": "Basic metabolic panel", "tag": [{"when": null, "value": "recommended"}], "flags_set": [], "debrief_note": "Essential before and during diuresis. Three things matter here. The sodium of 133 is dilutional and is an established marker of worse prognosis in heart failure, not simply a number to correct. The creatinine of 1.62 against a baseline of 1.4 is cardiorenal physiology, driven substantially by venous congestion rather than by poor forward flow, and it is not a reason to withhold diuresis; decongestion often improves it. The potassium will fall as you diurese, in a patient on digoxin-free but arrhythmia-prone ground, so it needs rechecking."}, {"catalog_id": "labs_bnp", "display_name": "B-type natriuretic peptide", "tag": [{"when": null, "value": "recommended"}], "flags_set": [], "debrief_note": "Most useful when the diagnosis is uncertain, which in this presentation it is not. A value of 2840 is strongly supportive but it is not the reason to treat, and treating the number rather than the patient is the failure mode. Know what shifts it: it rises with age, renal impairment and atrial fibrillation, and it is lowered by obesity, so a value that looks unimpressive in a heavy patient may still be meaningful. In a patient with chronic heart failure, the comparison that matters is against his own previous values rather than against a population threshold.", "references": ["Maisel AS, Krishnaswamy P, Nowak RM, et al. Rapid measurement of B-type natriuretic peptide in the emergency diagnosis of heart failure. N Engl J Med. 2002;347(3):161-7. [UNVERIFIED, confirm before release]"]}, {"catalog_id": "labs_troponin_hs", "display_name": "High-sensitivity troponin I", "tag": [{"when": null, "value": "recommended"}], "flags_set": [], "debrief_note": "Appropriate to send, and the interpretation is the teaching point rather than the ordering. See the note on aspirin: a mildly raised troponin in acute decompensated heart failure is usual, reflects demand ischaemia and wall stress, and carries prognostic weight without implying acute coronary occlusion. A single value cannot distinguish acute from chronic elevation; a delta on a repeat sample is what does that, and in this engine a repeat requires an explicit second order."}, {"catalog_id": "labs_vbg", "display_name": "Venous blood gas", "tag": [{"when": null, "value": "recommended"}], "flags_set": [], "debrief_note": "The most useful single test in the first two minutes. His pH of 7.29 with a pCO2 of 54 shows an acute respiratory acidosis: he is tiring, not simply hypoxaemic. That finding frightens people toward intubation, but hypercapnia in acute cardiogenic pulmonary oedema is usually fatigue and it corrects with positive pressure. The gas after non-invasive ventilation, if repeated, demonstrates exactly that."}, {"catalog_id": "labs_lactate", "display_name": "Lactate", "tag": [{"when": null, "value": "recommended"}], "flags_set": [], "debrief_note": "A useful perfusion check that supports the warm rather than cold classification. The value of 2.1 is mildly raised and is explained by the work of respiratory muscles, not by circulatory failure. Reading it as evidence of sepsis or of cardiogenic shock in a patient with warm peripheries, normal mentation and a systolic pressure of 188 is a common misstep."}, {"catalog_id": "labs_lft", "display_name": "Liver function tests", "tag": [{"when": null, "value": "neutral"}], "flags_set": [], "debrief_note": "Not required, and mildly informative if sent. The transaminase and bilirubin pattern here is congestive hepatopathy from raised right-sided filling pressures, matching the tender enlarged liver on examination. It is a congestion finding rather than a hepatic problem in its own right."}, {"catalog_id": "labs_magnesium", "display_name": "Magnesium", "tag": [{"when": null, "value": "neutral"}], "flags_set": [], "debrief_note": "Reasonable to send alongside potassium in a patient about to receive loop diuretics, since magnesium losses accompany potassium losses and unreplaced hypomagnesaemia makes hypokalaemia refractory. Normal here."}, {"catalog_id": "labs_tsh", "display_name": "Thyroid stimulating hormone", "tag": [{"when": null, "value": "neutral"}], "flags_set": [], "debrief_note": "Part of a precipitant search rather than an emergency test. Thyrotoxicosis and profound hypothyroidism can both decompensate a failing ventricle, and it is a sensible inpatient investigation. It will not change anything in the next hour."}, {"catalog_id": "labs_urinalysis", "display_name": "Urinalysis", "tag": [{"when": null, "value": "neutral"}], "flags_set": [], "debrief_note": "Neutral. Part of an infection screen if you are pursuing one; not informative here."}, {"catalog_id": "echo_formal", "display_name": "Formal transthoracic echocardiogram", "tag": [{"when": null, "value": "neutral"}], "flags_set": [], "debrief_note": "Appropriate to request for the admission, not available on the timescale of this resuscitation, and not needed to make the decisions in front of you. Bedside ultrasound answers the immediate questions about ventricular function, filling and B-lines; the formal study answers the questions about valve lesions and quantified ejection fraction that will guide his inpatient therapy."}, {"catalog_id": "consult_cardiology", "display_name": "Consult cardiology", "tag": [{"when": null, "value": "recommended"}], "flags_set": ["cardiology_consulted"], "state_changing": true, "debrief_note": "Appropriate, and more useful once you have an ECG and a troponin to discuss, since the first question you will be asked is whether this is ischaemic. Calling before the workup exists produces a conversation about what to order rather than about what to do."}, {"catalog_id": "consult_critical_care", "display_name": "Consult critical care", "tag": [{"when": null, "value": "recommended"}], "flags_set": ["critical_care_consulted"], "state_changing": true, "debrief_note": "A patient on non-invasive ventilation with a titrating vasoactive infusion needs a bed that can continue both. Making that call early shortens the time to an appropriate bed, which is often the rate-limiting step in the department."}, {"catalog_id": "consult_nephrology", "display_name": "Consult nephrology", "tag": [{"when": null, "value": "neutral"}], "flags_set": [], "state_changing": false, "debrief_note": "Premature. A creatinine of 1.62 against a baseline of 1.4 in a congested patient is cardiorenal physiology, and the treatment for it is decongestion rather than renal replacement. Urgent dialysis is indicated for refractory hyperkalaemia, severe acidosis, uraemic complications, or diuretic-refractory fluid overload, none of which is present. The call is not harmful; it is a signal that the creatinine was read as a kidney problem rather than as a heart problem seen through the kidney."}, {"catalog_id": "handoff_submit", "display_name": "Submit handoff", "tag": [{"when": null, "value": "neutral"}], "flags_set": ["handoff_submitted"], "state_changing": true, "debrief_note": "Completion of the case. Scored on disposition and diagnosis separately; see the handoff section."}, {"catalog_id": "arterial_line", "display_name": "Insert arterial line", "tag": [{"when": null, "value": "neutral"}], "flags_set": ["art_line", "bp_monitoring_q5"], "prerequisites": [], "debrief_note": "Reasonable but rarely necessary here, and it should not delay treatment. It gives beat-to-beat pressure while titrating a vasodilator, which is genuinely useful, and it becomes more attractive if the patient is intubated and on a vasopressor. Frequent non-invasive cycling achieves most of the benefit in a patient who is improving. Placing one before applying positive pressure would be a clear misordering of priorities."}, {"catalog_id": "exam_airway", "display_name": "Perform Airway Exam", "tag": [{"when": null, "value": "neutral"}], "state_changing": false, "debrief_note": "In a breathless patient the airway question is answered by listening to him talk. Speech fragmented into two or three word bursts is a measurement of respiratory reserve, not a communication problem, and it is the finding that tells you how close he is to tiring. A patient who can still protect his airway and speak does not need a tube yet, however bad he looks."}, {"catalog_id": "exam_breath", "display_name": "Perform Breathing Exam", "tag": [{"when": null, "value": "neutral"}], "state_changing": false, "debrief_note": "Work of breathing is the end-of-bed assessment and it does most of the triage in this case. Upright posture the patient will not abandon, accessory muscle use, intercostal indrawing and diaphoresis together identify a patient who needs an intervention in the next few minutes rather than the next hour. This is also the finding that improves first and most visibly with non-invasive ventilation, which makes it the one to re-check after you act."}, {"catalog_id": "exam_circ", "display_name": "Perform Circulation Exam", "tag": [{"when": null, "value": "neutral"}], "state_changing": false, "debrief_note": "This is the manoeuvre that decides the case. Warm peripheries with a capillary refill under two seconds and full pulses place him in the warm profile, which is what makes vasodilation and diuresis safe and inotropes wrong. The same patient after intubation is cool and mottled with a four second refill, and the treatment inverts. Perfusion is not a number on the monitor; it is this examination."}, {"catalog_id": "exam_neck", "display_name": "Perform Neck Exam", "tag": [{"when": null, "value": "neutral"}], "state_changing": false, "debrief_note": "The single most useful physical sign in this case, and the one most often skipped. A raised jugular venous pressure separates this patient from the septic patient who needs fluid and from the asthmatic who needs bronchodilators. Auscultating the chest without also looking at the neck veins is how the wheeze gets misread as bronchospasm. The hepatojugular reflux is the confirmatory manoeuvre when the column is technically difficult to see, which it often is in a heavy, breathless patient who will not lie back; a sustained rise that does not fall back while pressure is maintained is a positive test."}, {"catalog_id": "exam_card", "display_name": "Perform Cardiovascular Exam", "tag": [{"when": null, "value": "neutral"}], "state_changing": false, "debrief_note": "A third heart sound is one of the few examination findings in dyspnoea with a high positive likelihood ratio for heart failure. It is insensitive, so its absence proves little, but hearing it in this context is close to diagnostic. The laterally displaced apex is chronic, not acute. The symmetrical pitting oedema measures how long this has been building; it is days of accumulated sodium and water, and it will not resolve in the emergency department however much you diurese."}, {"catalog_id": "exam_pulm", "display_name": "Perform Pulmonary Exam", "tag": [{"when": null, "value": "neutral"}], "state_changing": false, "debrief_note": "Crackles with an overlying expiratory wheeze. Cardiac asthma is the trap: the wheeze is deliberate and it is there to attract a bronchodilator. What settles it is not the chest at all, it is the neck veins and the peripheries."}, {"catalog_id": "exam_abd", "display_name": "Perform Abdominal Exam", "tag": [{"when": null, "value": "neutral"}], "state_changing": false, "debrief_note": "The tender enlarged liver is congestive hepatopathy from raised right-sided pressures, and it matches the abnormal liver enzymes if those were sent. It also matters as a negative: a soft abdomen without peritonism moves an intra-abdominal catastrophe well down the list in a patient who is tachycardic and unwell."}, {"catalog_id": "exam_msk", "display_name": "Perform Musculoskeletal Exam", "tag": [{"when": null, "value": "neutral"}], "state_changing": false, "debrief_note": "Here this is a pertinent negative and nothing else. Symmetrical oedema with no calf tenderness, asymmetry or cords argues against deep vein thrombosis, which is the reasoning that should stop the D-dimer being sent rather than the D-dimer result stopping it afterwards."}, {"catalog_id": "exam_skin", "display_name": "Perform Skin Exam", "tag": [{"when": null, "value": "neutral"}], "state_changing": false, "debrief_note": "Peripheral temperature and sweating are the two bedside proxies for perfusion and sympathetic drive. He is sweating heavily but his skin is warm, which is the sympathetic response to respiratory distress rather than the vasoconstriction of shock. Cold and sweaty would mean something entirely different and would change the treatment."}, {"catalog_id": "exam_neuro", "display_name": "Perform Neurological Exam", "tag": [{"when": null, "value": "neutral"}], "state_changing": false, "debrief_note": "Mental status is a perfusion measurement, and here it is the reassuring one. A patient who is alert, oriented and anxious is perfusing his brain, which supports the warm classification and argues against cardiogenic shock. A patient with the same vital signs who has become drowsy is a different and much more urgent problem."}, {"catalog_id": "exam_psych", "display_name": "Perform Psychological Exam", "tag": [{"when": null, "value": "neutral"}], "state_changing": false, "debrief_note": "Anxiety in acute pulmonary oedema is a symptom of hypoxaemia and air hunger, not a psychiatric finding, and it settles as the physiology settles. Recording it matters because it is the baseline against which a later change in mental state is judged."}], "follow_ups": [{"id": "post_intubation_sedation", "triggered_by": "intubation_rsi", "applies_when": "flag intubated set", "deadline_seconds": 60, "satisfied_by": ["post_intubation_sedation_infusion"], "nurse_prompt": "He's tubed and he's still paralysed from the rocuronium. Do you want to write him up for something for sedation and pain?", "debrief_note": "A paralysed patient without sedation is awake, aware, and unable to signal. This obligation is created by the intubation and cannot precede it, which is why it is modelled as a follow-up rather than a prerequisite. Choose an agent with the blood pressure in mind."}, {"id": "post_intubation_cxr", "triggered_by": "intubation_rsi", "applies_when": "flag intubated set", "deadline_seconds": 90, "satisfied_by": ["cxr_portable"], "nurse_prompt": "Do you want a film to check the tube position? Any film you ordered before the tube went in won't show it.", "debrief_note": "Radiographic confirmation of tube depth is standard after intubation and does not replace waveform capnography, which confirms tracheal placement. The engine detail matters here: results freeze at the state in which they were ordered, so a chest film requested before intubation will not show the tube even if it arrives afterwards. A repeat order is required."}, {"id": "bp_cycling_after_nitrate", "triggered_by": "nitroglycerin_infusion", "applies_when": "flag nitro_infusion_running set", "deadline_seconds": 45, "satisfied_by": ["bp_cycling_q5min", "arterial_line"], "nurse_prompt": "The nitro is running. The cuff is set to cycle every fifteen minutes at the moment. Do you want it more often than that?", "debrief_note": "A titratable vasodilator needs a measurement interval short enough to catch an overshoot before it becomes symptomatic. Fifteen-minute cycling while titrating nitroglycerin is how a patient becomes hypotensive between readings."}, {"id": "urine_output_after_diuretic", "triggered_by": ["furosemide_iv"], "applies_when": "flag diuretic_given set", "deadline_seconds": 150, "satisfied_by": ["urine_output_monitoring", "foley_catheter"], "nurse_prompt": "He's had his diuretic. Do you want me to start recording his urine output?", "debrief_note": "Diuretic response is how you find out whether your treatment is working and is the earliest indicator of diuretic resistance. It does not require a urinary catheter."}], "follow_up_condition_note": "None of the four applies_when conditions above does discriminating work in this case; each is trivially true once its trigger has fired. That is honest rather than clever: the mechanism exists for cases where an obligation applies only sometimes. Flagged so the reviewer does not mistake the conditions for meaningful clinical gating.", "prompt_cap_recommendation": {"per_phase": 3, "rationale": "The presentation phase carries five prompts with an escalation. Firing all of them would nag. Suggested ordering if a cap is enforced: NIV, then nitroglycerin, then ECG, with the chest film and the adherence question suppressed."}, "prerequisite_semantics_note": "Prerequisite 'when' states the condition that MUST BE TRUE for the action to proceed, matching the worked table in section 8.1 of the authoring requirements. The failure message is shown when the condition evaluates false.", "content_keys": {"exam": {"authoring_note": "Bound to the action catalog's closed set of 14 manoeuvres. Findings are placed according to the catalog's exam_finding_routing map, not by the author's preference: peripheral oedema sits under the cardiovascular exam, jugular venous pressure and hepatojugular reflux under the neck exam, capillary refill and peripheral temperature under the circulation exam. exam_heent, exam_gu and exam_back are not authored and inherit the catalog default.", "exam_airway": [{"when": "phase is post_intubation_hypotension OR phase is intubated_stabilized", "value": {"kind": "exam_findings", "abnormal": true, "findings": "Endotracheal tube in place and secured at the teeth, cuff inflated. Airway protected by the tube. No secretions requiring suction."}}, {"when": "phase is presentation", "value": {"kind": "exam_findings", "abnormal": true, "findings": "Airway patent and self-maintained. No stridor, no drooling, no oropharyngeal swelling. He is speaking, but only in two or three word bursts, pausing to breathe between them."}}, {"when": "phase is stabilizing", "value": {"kind": "exam_findings", "abnormal": true, "findings": "Airway patent and self-maintained under the mask. Speaking in short sentences."}}, {"when": null, "value": {"kind": "exam_findings", "abnormal": false, "findings": "Airway patent and self-maintained. Speaking in full sentences. No stridor."}}], "exam_breath": [{"when": "phase is post_intubation_hypotension OR phase is intubated_stabilized", "value": {"kind": "exam_findings", "abnormal": true, "findings": "Ventilated. Chest rises symmetrically with each delivered breath. No accessory muscle use, no spontaneous effort against the ventilator."}}, {"when": "phase is presentation", "value": {"kind": "exam_findings", "abnormal": true, "findings": "Marked increase in the work of breathing. Respiratory rate in the low thirties. Accessory muscle use at the neck with intercostal indrawing. Sitting bolt upright, gripping the trolley rails and refusing to lie back. Chest rise symmetrical."}}, {"when": "phase is stabilizing", "value": {"kind": "exam_findings", "abnormal": true, "findings": "Work of breathing reduced on the mask. Rate in the mid twenties. Accessory muscle use present but less marked. No longer gripping the rails. Chest rise symmetrical."}}, {"when": null, "value": {"kind": "exam_findings", "abnormal": false, "findings": "Breathing comfortably at a normal rate. No accessory muscle use and no indrawing. Chest rise symmetrical and air entry equal."}}], "exam_circ": [{"when": "phase is post_intubation_hypotension", "value": {"kind": "exam_findings", "abnormal": true, "findings": "Cool peripherally with mottling over the knees. Capillary refill four seconds. Radial pulses thready. No external haemorrhage."}}, {"when": "phase is intubated_stabilized", "value": {"kind": "exam_findings", "abnormal": true, "findings": "Peripherally warm again. Capillary refill under three seconds. Pulses easily palpable and equal. No external haemorrhage."}}, {"when": "phase is presentation", "value": {"kind": "exam_findings", "abnormal": true, "findings": "Warm and well perfused peripherally despite the distress. Capillary refill under two seconds. Radial and dorsalis pedis pulses full and equal bilaterally. Skin is sweaty but not cold. No external haemorrhage."}}, {"when": null, "value": {"kind": "exam_findings", "abnormal": false, "findings": "Warm and well perfused. Capillary refill under two seconds. Peripheral pulses full and equal. No external haemorrhage."}}], "exam_neck": [{"when": "phase is post_intubation_hypotension OR phase is intubated_stabilized", "value": {"kind": "exam_findings", "abnormal": true, "findings": "Jugular venous pulsation visible to the angle of the jaw at 45 degrees, approximately 14 cm of water. Harder to assess against positive pressure ventilation, but clearly elevated. Trachea midline. Sustained right upper quadrant pressure raises the venous column further and it does not fall back while pressure is maintained: hepatojugular reflux positive."}}, {"when": null, "value": {"kind": "exam_findings", "abnormal": true, "findings": "Jugular venous pulsation visible to the angle of the jaw with the head of the bed at 45 degrees, approximately 14 cm of water. Clearly and unambiguously elevated. Trachea midline. No lymphadenopathy. Sustained pressure over the right upper quadrant produces a rise in the jugular venous column that does not fall back while pressure is maintained: hepatojugular reflux positive."}}], "exam_card": [{"when": "phase is post_intubation_hypotension", "value": {"kind": "exam_findings", "abnormal": true, "findings": "Tachycardic at around 128, regular, heart sounds soft. A third heart sound is present. Soft systolic murmur at the apex. Two plus pitting oedema to the mid-shin bilaterally, symmetrical."}}, {"when": "phase is intubated_stabilized", "value": {"kind": "exam_findings", "abnormal": true, "findings": "Regular at around 96. Third heart sound still audible. Grade 2 out of 6 holosystolic murmur at the apex. Two plus pitting oedema to the mid-shin bilaterally, symmetrical."}}, {"when": "phase is presentation OR phase is stabilizing", "value": {"kind": "exam_findings", "abnormal": true, "findings": "Tachycardic and regular. A third heart sound is present at the apex, best heard with the bell in the left lateral position. Grade 2 out of 6 blowing holosystolic murmur at the apex radiating toward the axilla. The apex beat is displaced laterally to the anterior axillary line. Two plus pitting oedema to the mid-shin bilaterally, symmetrical, with indentation from his sock at the ankle."}}, {"when": null, "value": {"kind": "exam_findings", "abnormal": true, "findings": "Regular, rate around 90. A third heart sound is still audible. Grade 2 out of 6 holosystolic murmur at the apex. Apex beat displaced laterally. Two plus pitting oedema to the mid-shin bilaterally, symmetrical."}}], "exam_pulm": [{"when": "phase is post_intubation_hypotension OR phase is intubated_stabilized", "value": {"kind": "exam_findings", "abnormal": true, "findings": "Bilateral coarse crackles to the mid-zones. Equal breath sounds both sides with the tube in place. No wheeze."}}, {"when": "phase is presentation", "value": {"kind": "exam_findings", "abnormal": true, "findings": "Fine and coarse crackles bilaterally from the bases up to the upper zones, with a scattered expiratory wheeze overlying them. Air entry is poor at both bases. No focal absence of breath sounds."}}, {"when": "phase is stabilizing", "value": {"kind": "exam_findings", "abnormal": true, "findings": "Crackles bilaterally to the mid-zones, no longer audible in the upper zones. The wheeze has resolved. Air entry improved."}}, {"when": null, "value": {"kind": "exam_findings", "abnormal": true, "findings": "Crackles limited to both bases. No wheeze. Good air entry throughout."}}], "exam_abd": [{"when": null, "value": {"kind": "exam_findings", "abnormal": true, "findings": "Soft and mildly distended. The liver edge is palpable about three centimetres below the costal margin and is tender to press. No rebound, no guarding. No pulsatile mass. Bowel sounds present."}}], "exam_msk": [{"when": null, "value": {"kind": "exam_findings", "abnormal": false, "findings": "No deformity, joint effusion or focal bony tenderness. Compartments soft. No calf tenderness, asymmetry or palpable cords. Distal sensation and motor function intact in all four limbs. Bilateral symmetrical pitting oedema is present; see the cardiovascular examination."}}], "exam_skin": [{"when": "phase is post_intubation_hypotension", "value": {"kind": "exam_findings", "abnormal": true, "findings": "Cool and mottled over the knees and forearms. No rash."}}, {"when": "phase is intubated_stabilized", "value": {"kind": "exam_findings", "abnormal": false, "findings": "Warm and dry. Mottling resolved. No rash."}}, {"when": "phase is presentation", "value": {"kind": "exam_findings", "abnormal": true, "findings": "Warm to the touch and visibly sweating over the forehead, neck and chest. No rash. No cyanosis of the lips at present."}}, {"when": "phase is stabilizing", "value": {"kind": "exam_findings", "abnormal": true, "findings": "Damp but no longer actively sweating. Warm. No rash."}}, {"when": null, "value": {"kind": "exam_findings", "abnormal": false, "findings": "Warm and dry. No rash."}}], "exam_neuro": [{"when": "phase is post_intubation_hypotension OR phase is intubated_stabilized", "value": {"kind": "exam_findings", "abnormal": true, "findings": "Sedated and not responsive to voice. Pupils equal and reactive but sluggish. Moving nothing spontaneously."}}, {"when": "phase is presentation", "value": {"kind": "exam_findings", "abnormal": false, "findings": "Alert and oriented to person, place and time, GCS 15, though answers are clipped by breathlessness. No focal deficit. Moving all four limbs normally."}}, {"when": null, "value": {"kind": "exam_findings", "abnormal": false, "findings": "Alert and oriented, GCS 15, answering in full sentences. No focal deficit."}}], "exam_psych": [{"when": "phase is post_intubation_hypotension OR phase is intubated_stabilized", "value": {"kind": "exam_findings", "abnormal": true, "findings": "Sedated. Not assessable."}}, {"when": "phase is presentation", "value": {"kind": "exam_findings", "abnormal": true, "findings": "Anxious and frightened, but cooperative and following instruction. Thought linear. No suicidal or homicidal ideation. No hallucinations."}}, {"when": null, "value": {"kind": "exam_findings", "abnormal": false, "findings": "Calm and cooperative with appropriate affect. Thought linear and goal directed. No suicidal or homicidal ideation."}}]}, "labs": {"authoring_note": "Only abnormal values and values that trend with treatment are authored. Everything else inherits a normal result appropriate to a 65 year old man with stage 3 chronic kidney disease. Results freeze at the state in which they were ordered, not the state at which they arrive.", "labs_cbc": {"changes_with_state": false, "rules": [{"when": null, "value": {"kind": "panel", "abnormal": true, "components": [{"label": "WBC", "value": "8.2", "unit": "x10^9/L", "reference_range": "4.0-11.0", "abnormal": false}, {"label": "Hemoglobin", "value": "12.4", "unit": "g/dL", "reference_range": "13.5-17.5 (M)", "abnormal": true}, {"label": "Hematocrit", "value": "37.5", "unit": "%", "reference_range": "41-53 (M)", "abnormal": true}, {"label": "MCV", "value": "88", "unit": "fL", "reference_range": "80-100", "abnormal": false}, {"label": "Platelets", "value": "232", "unit": "x10^9/L", "reference_range": "150-400", "abnormal": false}], "comment": "Differential unremarkable."}, "prose": "White cell count 8.2 x10^9/L. Haemoglobin 12.4 g/dL (low). Haematocrit 37.5%. Mean corpusc
